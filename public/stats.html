<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访问统计 - 作业公布站</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    /* ========== 布局基础 ========== */
    .stats-layout { padding: 0 0 40px; }

    /* ========== Hero 区域 ========== */
    .stats-hero {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 50%, #EC4899 100%);
      padding: 40px 0 48px;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }
    .stats-hero::before {
      content: "";
      position: absolute;
      top: -50%;
      right: -20%;
      width: 500px;
      height: 500px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }
    .stats-hero::after {
      content: "";
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 350px;
      height: 350px;
      background: rgba(255,255,255,0.04);
      border-radius: 50%;
    }
    .hero-content { position: relative; z-index: 1; }
    .hero-title {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
    }
    .hero-subtitle {
      font-size: 15px;
      color: rgba(255,255,255,0.75);
      margin-bottom: 28px;
    }
    .hero-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .hero-stat-card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: var(--radius-lg);
      padding: 20px;
      text-align: center;
      transition: var(--transition);
    }
    .hero-stat-card:hover {
      background: rgba(255,255,255,0.22);
      transform: translateY(-2px);
    }
    .hero-stat-value {
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
    }
    .hero-stat-label {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      margin-top: 4px;
      font-weight: 500;
    }

    /* ========== 工具栏 ========== */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    .time-filter {
      display: flex;
      gap: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-full);
      padding: 4px;
    }
    .time-btn {
      padding: 8px 18px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      background: transparent;
      transition: var(--transition);
    }
    .time-btn:hover { color: var(--primary); background: var(--primary-soft); }
    .time-btn.active {
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      box-shadow: 0 2px 8px rgba(75,63,227,0.25);
    }
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .auto-refresh-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      color: var(--success);
      background: rgba(29,201,129,0.1);
      border: 1px solid rgba(29,201,129,0.2);
    }
    .auto-refresh-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ========== 统计卡片网格 ========== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card .stat-icon {
      border-radius: var(--radius);
    }
    .stat-card-icon-primary .stat-icon {
      background: linear-gradient(135deg, #EEF0FF, #DDE2FF);
      color: var(--primary);
    }
    .stat-card-icon-success .stat-icon {
      background: linear-gradient(135deg, #ECFDF5, #D1FAE5);
      color: var(--success);
    }
    .stat-card-icon-warning .stat-icon {
      background: linear-gradient(135deg, #FFFBEB, #FEF3C7);
      color: var(--warning);
    }
    .stat-card-icon-info .stat-icon {
      background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
      color: var(--info);
    }
    [data-theme="dark"] .stat-card-icon-primary .stat-icon {
      background: linear-gradient(135deg, #1F1B4A, #2D2A6B);
    }
    [data-theme="dark"] .stat-card-icon-success .stat-icon {
      background: linear-gradient(135deg, #064E3B, #065F46);
    }
    [data-theme="dark"] .stat-card-icon-warning .stat-icon {
      background: linear-gradient(135deg, #78350F, #92400E);
    }
    [data-theme="dark"] .stat-card-icon-info .stat-icon {
      background: linear-gradient(135deg, #1E3A5F, #1E40AF);
    }

    /* ========== 内容卡片 ========== */
    .content-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
      margin-bottom: 20px;
      transition: var(--transition);
    }
    .content-card:hover { box-shadow: var(--shadow-sm); }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-body { padding: 20px; }

    /* ========== 双列布局 ========== */
    .two-col-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    /* ========== 柱状图（CSS-only） ========== */
    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 200px;
      padding: 0 4px;
      position: relative;
    }
    .bar-chart-wrapper { position: relative; }
    .bar-chart-y-axis {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 32px;
      width: 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      padding-right: 6px;
    }
    .bar-chart-y-label {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .bar-chart-area {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 200px;
      padding-left: 36px;
      padding-bottom: 32px;
      position: relative;
    }
    .bar-chart-area::before {
      content: "";
      position: absolute;
      left: 36px;
      right: 0;
      bottom: 32px;
      border-top: 1px dashed var(--border-light);
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      position: relative;
      min-width: 0;
    }
    .bar {
      width: 100%;
      max-width: 44px;
      border-radius: 6px 6px 2px 2px;
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-light) 100%);
      transition: height 0.8s cubic-bezier(0.4,0,0.2,1);
      position: relative;
      cursor: pointer;
      min-height: 2px;
    }
    .bar:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 12px rgba(75,63,227,0.3);
    }
    .bar-tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: var(--tooltip-bg);
      color: var(--tooltip-text);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: all 0.2s ease;
      z-index: 10;
    }
    .bar:hover .bar-tooltip {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
    .bar-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 48px;
      text-align: center;
    }
    .bar-value-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--primary);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .bar-col:hover .bar-value-label { opacity: 1; }

    /* ========== 横向条形图 ========== */
    .h-bar-chart { display: flex; flex-direction: column; gap: 14px; }
    .h-bar-item { display: flex; align-items: center; gap: 12px; }
    .h-bar-rank {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-sm);
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .h-bar-rank.top { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; }
    .h-bar-name {
      width: 100px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    .h-bar-track {
      flex: 1;
      height: 24px;
      background: var(--bg-hover);
      border-radius: var(--radius-full);
      overflow: hidden;
      position: relative;
    }
    .h-bar-fill {
      height: 100%;
      border-radius: var(--radius-full);
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      transition: width 1s cubic-bezier(0.4,0,0.2,1);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      min-width: 0;
    }
    .h-bar-count {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
    }

    /* ========== 饼图（CSS conic-gradient） ========== */
    .pie-chart-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 8px 0;
    }
    .pie-chart {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
      transition: var(--transition);
    }
    .pie-chart:hover { transform: scale(1.03); }
    .pie-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--bg-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(0,0,0,0.06);
    }
    .pie-center-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.1;
    }
    .pie-center-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .pie-legend { display: flex; flex-direction: column; gap: 12px; }
    .pie-legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pie-legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .pie-legend-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      min-width: 48px;
    }
    .pie-legend-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .pie-legend-pct {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 4px;
    }

    /* ========== 时段热力图 ========== */
    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 4px;
    }
    .heatmap-cell {
      aspect-ratio: 1.4;
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      transition: var(--transition);
      cursor: default;
      position: relative;
      min-height: 36px;
    }
    .heatmap-cell:hover { transform: scale(1.1); z-index: 2; }
    .heatmap-cell .hm-hour {
      font-size: 9px;
      opacity: 0.8;
      font-weight: 500;
    }
    .heatmap-labels {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 4px;
      margin-top: 4px;
    }
    .heatmap-label {
      text-align: center;
      font-size: 9px;
      color: var(--text-muted);
    }

    /* ========== 访问记录表格 ========== */
    .visit-table {
      width: 100%;
      border-collapse: collapse;
    }
    .visit-table th, .visit-table td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border-light);
      font-size: 13px;
    }
    .visit-table th {
      background: var(--bg-hover);
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .visit-table tbody tr { transition: var(--transition); }
    .visit-table tbody tr:hover { background: var(--bg-hover); }
    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-bar input {
      padding: 8px 14px;
      font-size: 13px;
      border-radius: var(--radius-full);
      border: 1.5px solid var(--border);
      width: 220px;
      background: var(--bg-card);
      color: var(--text-primary);
    }
    .search-bar input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 16px 0 4px;
    }
    .page-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      transition: var(--transition);
    }
    .page-btn:hover { border-color: var(--primary); color: var(--primary); }
    .page-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .page-info {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0 8px;
    }

    /* ========== 设备图标 ========== */
    .device-icon { font-size: 16px; margin-right: 4px; }

    /* ========== 骨架屏 ========== */
    .skeleton-block {
      background: var(--skeleton-base);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
    }
    .skeleton-block::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent 0%, var(--skeleton-shine) 40%, var(--skeleton-shine) 60%, transparent 100%);
      background-size: 800px 100%;
      animation: skeletonShimmer 1.6s ease-in-out infinite;
    }
    .skeleton-row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }
    .skeleton-card-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .skeleton-stat {
      height: 100px;
      border-radius: var(--radius-lg);
    }
    .skeleton-chart {
      height: 230px;
      border-radius: var(--radius);
    }
    .skeleton-table-row {
      height: 42px;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
    }

    /* ========== 响应式 ========== */
    @media (max-width: 1024px) {
      .two-col-grid { grid-template-columns: 1fr; }
      .hero-stats { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .skeleton-card-grid { grid-template-columns: repeat(2, 1fr); }
      .hero-stats { grid-template-columns: repeat(2, 1fr); }
      .hero-title { font-size: 22px; }
      .toolbar { flex-direction: column; align-items: flex-start; }
      .time-filter { width: 100%; justify-content: center; }
      .heatmap-grid { grid-template-columns: repeat(6, 1fr); }
      .heatmap-labels { grid-template-columns: repeat(6, 1fr); }
      .pie-chart-container { flex-direction: column; }
      .search-bar input { width: 100%; }
      .h-bar-name { width: 70px; }
      .visit-table { font-size: 12px; }
      .visit-table th, .visit-table td { padding: 8px 10px; }
      .stat-value { font-size: 22px !important; }
      .bar-chart-area { height: 160px; }
    }
    @media (max-width: 480px) {
      .hero-stats { grid-template-columns: 1fr 1fr; gap: 10px; }
      .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .heatmap-grid { grid-template-columns: repeat(4, 1fr); }
      .heatmap-labels { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
  <header class="header" id="header"></header>

  <!-- ===== Hero 区域 ===== -->
  <section class="stats-hero" id="heroSection">
    <div class="container hero-content">
      <h1 class="hero-title">📊 数据统计中心</h1>
      <p class="hero-subtitle">实时监控站点访问数据，洞察用户行为趋势</p>
      <div class="hero-stats" id="heroStats">
        <div class="hero-stat-card">
          <div class="hero-stat-value" id="heroTotal">-</div>
          <div class="hero-stat-label">总访问量 (PV)</div>
        </div>
        <div class="hero-stat-card">
          <div class="hero-stat-value" id="heroToday">-</div>
          <div class="hero-stat-label">今日访问</div>
        </div>
        <div class="hero-stat-card">
          <div class="hero-stat-value" id="heroUV">-</div>
          <div class="hero-stat-label">独立访客 (UV)</div>
        </div>
        <div class="hero-stat-card">
          <div class="hero-stat-value" id="heroAvg">-</div>
          <div class="hero-stat-label">日均访问</div>
        </div>
      </div>
    </div>
  </section>

  <main class="container stats-layout">

    <!-- ===== 工具栏 ===== -->
    <div class="toolbar">
      <div class="time-filter">
        <button class="time-btn" data-range="today" onclick="setTimeRange('today')">今天</button>
        <button class="time-btn active" data-range="week" onclick="setTimeRange('week')">本周</button>
        <button class="time-btn" data-range="month" onclick="setTimeRange('month')">本月</button>
        <button class="time-btn" data-range="all" onclick="setTimeRange('all')">全部</button>
      </div>
      <div class="toolbar-right">
        <div class="auto-refresh-badge" id="autoRefreshBadge">
          <span class="auto-refresh-dot"></span>
          <span id="refreshCountdown">60s 后刷新</span>
        </div>
        <button class="btn btn-outline btn-sm" onclick="exportCSV()">📥 导出 CSV</button>
        <button class="btn btn-outline btn-sm" onclick="loadAllData()">🔄 刷新</button>
      </div>
    </div>

    <!-- ===== 统计卡片 ===== -->
    <div class="stats-grid" id="statsCards">
      <div class="stat-card stat-card-icon-primary">
        <div class="stat-icon">👁️</div>
        <div>
          <div class="stat-value" id="totalVisits">-</div>
          <div class="stat-label">总访问次数</div>
        </div>
      </div>
      <div class="stat-card stat-card-icon-success">
        <div class="stat-icon">📅</div>
        <div>
          <div class="stat-value" id="todayVisits">-</div>
          <div class="stat-label">今日访问</div>
        </div>
      </div>
      <div class="stat-card stat-card-icon-warning">
        <div class="stat-icon">📆</div>
        <div>
          <div class="stat-value" id="weekVisits">-</div>
          <div class="stat-label">本周访问</div>
        </div>
      </div>
      <div class="stat-card stat-card-icon-info">
        <div class="stat-icon">📱</div>
        <div>
          <div class="stat-value" id="mobileRate">-</div>
          <div class="stat-label">移动端占比</div>
        </div>
      </div>
    </div>

    <!-- ===== 趋势图 + 页面排名 ===== -->
    <div class="two-col-grid">
      <!-- 访问趋势图 -->
      <div class="content-card">
        <div class="card-header">
          <span class="card-title">📈 访问趋势</span>
          <select class="filter-select" id="trendRange" onchange="renderTrendChart()" style="padding:6px 12px;font-size:12px;">
            <option value="7">最近 7 天</option>
            <option value="30">最近 30 天</option>
          </select>
        </div>
        <div class="card-body">
          <div id="trendChartSkeleton" style="display:none;">
            <div class="skeleton-block skeleton-chart"></div>
          </div>
          <div id="trendChartContainer"></div>
        </div>
      </div>

      <!-- 页面访问排名 -->
      <div class="content-card">
        <div class="card-header">
          <span class="card-title">🏆 页面访问 TOP 5</span>
        </div>
        <div class="card-body">
          <div id="pageRankSkeleton" style="display:none;">
            <div class="skeleton-block skeleton-chart"></div>
          </div>
          <div id="pageRankContainer"></div>
        </div>
      </div>
    </div>

    <!-- ===== 设备分布 + 时段热力图 ===== -->
    <div class="two-col-grid">
      <!-- 设备类型分布 -->
      <div class="content-card">
        <div class="card-header">
          <span class="card-title">💻 设备分布</span>
        </div>
        <div class="card-body">
          <div id="deviceChartSkeleton" style="display:none;">
            <div class="skeleton-block skeleton-chart"></div>
          </div>
          <div id="deviceChartContainer"></div>
        </div>
      </div>

      <!-- 时段热力图 -->
      <div class="content-card">
        <div class="card-header">
          <span class="card-title">🔥 访问时段分布</span>
        </div>
        <div class="card-body">
          <div id="heatmapSkeleton" style="display:none;">
            <div class="skeleton-block skeleton-chart"></div>
          </div>
          <div id="heatmapContainer"></div>
        </div>
      </div>
    </div>

    <!-- ===== 最近访问记录 ===== -->
    <div class="content-card">
      <div class="card-header">
        <span class="card-title">📋 最近访问记录</span>
        <div class="search-bar">
          <input type="text" id="visitSearch" placeholder="🔍 搜索页面或IP..." oninput="onVisitSearch()">
        </div>
      </div>
      <div style="overflow-x:auto">
        <table class="visit-table">
          <thead>
            <tr>
              <th>时间</th>
              <th>页面</th>
              <th>设备</th>
              <th>IP 地址</th>
            </tr>
          </thead>
          <tbody id="visitTableBody">
            <tr><td colspan="4" class="loading"><div class="spinner"></div>加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>

  </main>

  <script src="/js/common.js"></script>
  <script>
    // ============================================================
    // 全局状态
    // ============================================================
    let allVisits = [];           // 全部访问记录（原始）
    let filteredVisits = [];      // 当前时间范围过滤后的记录
    let searchedVisits = [];      // 搜索过滤后的记录
    let currentRange = 'week';
    let currentPage = 1;
    const PAGE_SIZE = 15;
    let refreshTimer = null;
    let countdownTimer = null;
    let countdown = 60;

    // ============================================================
    // 初始化
    // ============================================================
    async function init() {
      initHeader('stats');
      showAllSkeletons(true);
      await loadAllData();
      startAutoRefresh();
      recordVisit('/stats');
    }

    // ============================================================
    // 骨架屏
    // ============================================================
    function showAllSkeletons(show) {
      const ids = ['trendChartSkeleton','pageRankSkeleton','deviceChartSkeleton','heatmapSkeleton'];
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = show ? 'block' : 'none';
      });
      const containers = ['trendChartContainer','pageRankContainer','deviceChartContainer','heatmapContainer'];
      containers.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = show ? 'none' : 'block';
      });
    }

    // ============================================================
    // 数据加载
    // ============================================================
    async function loadAllData() {
      try {
        const res = await API.request('/api/stats/overview');
        if (!res.success) return;

        const data = res.data;
        const v = data.visits;
        allVisits = data.recentVisits || [];

        // Hero 区域
        const uniqueIPs = new Set(allVisits.map(x => x.ip).filter(Boolean));
        document.getElementById('heroTotal').textContent = v.totalVisits || 0;
        document.getElementById('heroToday').textContent = v.todayVisits || 0;
        document.getElementById('heroUV').textContent = uniqueIPs.size;
        // 计算日均（基于有数据的天数）
        const visitDays = new Set(allVisits.map(x => (x.created_at || '').split('T')[0]));
        const dayCount = Math.max(visitDays.size, 1);
        document.getElementById('heroAvg').textContent = Math.round(allVisits.length / dayCount);

        // 统计卡片
        document.getElementById('totalVisits').textContent = v.totalVisits || 0;
        document.getElementById('todayVisits').textContent = v.todayVisits || 0;
        document.getElementById('weekVisits').textContent = v.weekVisits || 0;
        const devArr = v.deviceStats || [];
        const mobile = (devArr.find(d => d.device_type === 'mobile') || {}).count || 0;
        const total = v.totalVisits || 1;
        document.getElementById('mobileRate').textContent = Math.round(mobile / total * 100) + '%';

        showAllSkeletons(false);
        applyTimeRange();
      } catch (e) {
        console.error('加载统计数据失败:', e);
        showAllSkeletons(false);
        document.getElementById('visitTableBody').innerHTML =
          '<tr><td colspan="4" class="text-center text-muted" style="padding:40px;">请登录后查看详细统计</td></tr>';
        document.querySelectorAll('.stat-value').forEach(el => { if (el.id) el.textContent = '-'; });
      }
    }

    // ============================================================
    // 时间范围筛选
    // ============================================================
    function setTimeRange(range) {
      currentRange = range;
      document.querySelectorAll('.time-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.range === range);
      });
      applyTimeRange();
    }

    function applyTimeRange() {
      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      let filterFrom = null;

      if (currentRange === 'today') {
        filterFrom = todayStart;
      } else if (currentRange === 'week') {
        filterFrom = new Date(todayStart.getTime() - 6 * 86400000);
      } else if (currentRange === 'month') {
        filterFrom = new Date(todayStart.getTime() - 29 * 86400000);
      }

      if (filterFrom) {
        const fromStr = filterFrom.toISOString();
        filteredVisits = allVisits.filter(v => v.created_at >= fromStr);
      } else {
        filteredVisits = [...allVisits];
      }

      searchedVisits = [...filteredVisits];
      document.getElementById('visitSearch').value = '';
      currentPage = 1;
      renderAllCharts();
      renderVisitTable();
    }

    // ============================================================
    // 渲染所有图表
    // ============================================================
    function renderAllCharts() {
      renderTrendChart();
      renderPageRank();
      renderDeviceChart();
      renderHeatmap();
    }

    // ============================================================
    // 访问趋势图（CSS 柱状图）
    // ============================================================
    function renderTrendChart() {
      const days = parseInt(document.getElementById('trendRange').value) || 7;
      const now = new Date();
      const dailyCounts = [];

      for (let i = days - 1; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
        const ds = d.toISOString().split('T')[0];
        const count = filteredVisits.filter(v => (v.created_at || '').startsWith(ds)).length;
        dailyCounts.push({ date: ds, label: (d.getMonth()+1) + '/' + d.getDate(), count });
      }

      const maxCount = Math.max(...dailyCounts.map(d => d.count), 1);
      const container = document.getElementById('trendChartContainer');

      if (filteredVisits.length === 0) {
        container.innerHTML = '<div class="text-center text-muted" style="padding:60px 0;">暂无数据</div>';
        return;
      }

      // Y 轴刻度
      const ySteps = 4;
      const yValues = [];
      for (let i = 0; i <= ySteps; i++) {
        yValues.push(Math.round(maxCount / ySteps * i));
      }

      let html = '<div style="position:relative;">';
      // Y 轴标签
      html += '<div style="display:flex;gap:8px;">';
      html += '<div style="display:flex;flex-direction:column;justify-content:space-between;height:200px;padding-bottom:0;min-width:28px;">';
      for (let i = yValues.length - 1; i >= 0; i--) {
        html += `<div style="font-size:10px;color:var(--text-muted);text-align:right;">${yValues[i]}</div>`;
      }
      html += '</div>';
      // 柱状图区域
      html += '<div class="bar-chart" style="flex:1;">';
      dailyCounts.forEach(d => {
        const h = maxCount > 0 ? (d.count / maxCount * 170) : 0;
        html += `
          <div class="bar-col">
            <div class="bar-value-label">${d.count}</div>
            <div class="bar" style="height:${h}px;">
              <div class="bar-tooltip">${d.date}：${d.count} 次</div>
            </div>
            <div class="bar-label">${d.label}</div>
          </div>`;
      });
      html += '</div></div></div>';

      container.innerHTML = html;

      // 动画：从 0 展开
      requestAnimationFrame(() => {
        container.querySelectorAll('.bar').forEach((bar, i) => {
          const target = bar.style.height;
          bar.style.height = '2px';
          setTimeout(() => { bar.style.height = target; }, i * 40);
        });
      });
    }

    // ============================================================
    // 页面访问排名 TOP 5
    // ============================================================
    function renderPageRank() {
      const pathCounts = {};
      filteredVisits.forEach(v => {
        const p = v.path || '/';
        pathCounts[p] = (pathCounts[p] || 0) + 1;
      });

      const sorted = Object.entries(pathCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      const container = document.getElementById('pageRankContainer');

      if (sorted.length === 0) {
        container.innerHTML = '<div class="text-center text-muted" style="padding:60px 0;">暂无数据</div>';
        return;
      }

      const maxVal = sorted[0][1] || 1;
      let html = '<div class="h-bar-chart">';
      sorted.forEach(([path, count], i) => {
        const pct = (count / maxVal * 100).toFixed(0);
        const displayName = path.length > 16 ? path.substring(0, 16) + '...' : path;
        html += `
          <div class="h-bar-item">
            <div class="h-bar-rank ${i < 3 ? 'top' : ''}">${i + 1}</div>
            <div class="h-bar-name" title="${escapeHtml(path)}">${escapeHtml(displayName)}</div>
            <div class="h-bar-track">
              <div class="h-bar-fill" style="width:0%;" data-width="${pct}%">
                <span class="h-bar-count">${count}</span>
              </div>
            </div>
          </div>`;
      });
      html += '</div>';
      container.innerHTML = html;

      // 动画展开
      requestAnimationFrame(() => {
        setTimeout(() => {
          container.querySelectorAll('.h-bar-fill').forEach(el => {
            el.style.width = el.dataset.width;
          });
        }, 100);
      });
    }

    // ============================================================
    // 设备分布饼图（conic-gradient）
    // ============================================================
    function renderDeviceChart() {
      const deviceMap = { desktop: '桌面端', mobile: '移动端', tablet: '平板' };
      const deviceColors = { desktop: '#4B3FE3', mobile: '#22A5F7', tablet: '#EFAA17' };
      const counts = {};

      filteredVisits.forEach(v => {
        const d = v.device_type || 'desktop';
        counts[d] = (counts[d] || 0) + 1;
      });

      const total = filteredVisits.length || 1;
      const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);

      const container = document.getElementById('deviceChartContainer');

      if (entries.length === 0) {
        container.innerHTML = '<div class="text-center text-muted" style="padding:60px 0;">暂无数据</div>';
        return;
      }

      // 构建 conic-gradient
      let gradientParts = [];
      let acc = 0;
      entries.forEach(([key, val]) => {
        const pct = (val / total * 100);
        const color = deviceColors[key] || '#94A3B8';
        gradientParts.push(`${color} ${acc}% ${acc + pct}%`);
        acc += pct;
      });

      let legendHtml = '<div class="pie-legend">';
      entries.forEach(([key, val]) => {
        const pct = (val / total * 100).toFixed(1);
        const color = deviceColors[key] || '#94A3B8';
        const name = deviceMap[key] || key;
        legendHtml += `
          <div class="pie-legend-item">
            <div class="pie-legend-dot" style="background:${color};"></div>
            <span class="pie-legend-name">${name}</span>
            <span class="pie-legend-value">${val}</span>
            <span class="pie-legend-pct">(${pct}%)</span>
          </div>`;
      });
      legendHtml += '</div>';

      container.innerHTML = `
        <div class="pie-chart-container">
          <div class="pie-chart" style="background:conic-gradient(${gradientParts.join(',')});">
            <div class="pie-center">
              <div class="pie-center-value">${total}</div>
              <div class="pie-center-label">总访问</div>
            </div>
          </div>
          ${legendHtml}
        </div>`;
    }

    // ============================================================
    // 时段热力图（24 小时）
    // ============================================================
    function renderHeatmap() {
      const hourCounts = new Array(24).fill(0);
      filteredVisits.forEach(v => {
        if (v.created_at) {
          const h = new Date(v.created_at).getHours();
          hourCounts[h]++;
        }
      });

      const maxHour = Math.max(...hourCounts, 1);
      const container = document.getElementById('heatmapContainer');

      if (filteredVisits.length === 0) {
        container.innerHTML = '<div class="text-center text-muted" style="padding:60px 0;">暂无数据</div>';
        return;
      }

      function getHeatColor(val, max) {
        const ratio = val / max;
        if (ratio === 0) return 'var(--bg-hover)';
        if (ratio < 0.2) return '#DBEAFE';
        if (ratio < 0.4) return '#93C5FD';
        if (ratio < 0.6) return '#60A5FA';
        if (ratio < 0.8) return '#3B82F6';
        return '#1D4ED8';
      }

      let gridHtml = '<div class="heatmap-grid">';
      let labelsHtml = '<div class="heatmap-labels">';

      for (let h = 0; h < 24; h++) {
        const color = getHeatColor(hourCounts[h], maxHour);
        const textColor = (hourCounts[h] / maxHour) >= 0.4 ? '#fff' : 'var(--text-secondary)';
        gridHtml += `
          <div class="heatmap-cell" style="background:${color};color:${textColor};"
               title="${h}:00 - ${h+1}:00：${hourCounts[h]} 次访问">
            ${hourCounts[h] > 0 ? hourCounts[h] : ''}
          </div>`;
        labelsHtml += `<div class="heatmap-label">${h}时</div>`;
      }

      gridHtml += '</div>';
      labelsHtml += '</div>';

      container.innerHTML = `
        <div>${gridHtml}${labelsHtml}</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:12px;justify-content:center;">
          <span style="font-size:11px;color:var(--text-muted);">少</span>
          <div style="width:14px;height:14px;border-radius:3px;background:var(--bg-hover);"></div>
          <div style="width:14px;height:14px;border-radius:3px;background:#DBEAFE;"></div>
          <div style="width:14px;height:14px;border-radius:3px;background:#93C5FD;"></div>
          <div style="width:14px;height:14px;border-radius:3px;background:#60A5FA;"></div>
          <div style="width:14px;height:14px;border-radius:3px;background:#3B82F6;"></div>
          <div style="width:14px;height:14px;border-radius:3px;background:#1D4ED8;"></div>
          <span style="font-size:11px;color:var(--text-muted);">多</span>
        </div>`;
    }

    // ============================================================
    // 访问记录表格（搜索 + 分页）
    // ============================================================
    function onVisitSearch() {
      const keyword = (document.getElementById('visitSearch').value || '').toLowerCase().trim();
      if (!keyword) {
        searchedVisits = [...filteredVisits];
      } else {
        searchedVisits = filteredVisits.filter(v =>
          (v.path || '').toLowerCase().includes(keyword) ||
          (v.ip || '').toLowerCase().includes(keyword)
        );
      }
      currentPage = 1;
      renderVisitTable();
    }

    function renderVisitTable() {
      const tbody = document.getElementById('visitTableBody');
      const total = searchedVisits.length;
      const totalPages = Math.max(Math.ceil(total / PAGE_SIZE), 1);
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * PAGE_SIZE;
      const pageData = searchedVisits.slice(start, start + PAGE_SIZE);

      if (pageData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted" style="padding:40px;">暂无匹配记录</td></tr>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      const deviceIcons = { mobile: '📱', desktop: '💻', tablet: '📋' };
      const deviceNames = { mobile: '移动端', desktop: '桌面端', tablet: '平板' };
      const deviceBadges = { mobile: 'badge-info', desktop: 'badge-primary', tablet: 'badge-warning' };

      tbody.innerHTML = pageData.map(v => {
        const d = v.device_type || 'desktop';
        return `<tr>
          <td style="white-space:nowrap;">${formatDateTime(v.created_at)}</td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(v.path || '/')}">${escapeHtml(v.path || '/')}</td>
          <td><span class="badge ${deviceBadges[d] || 'badge-primary'}"><span class="device-icon">${deviceIcons[d] || '💻'}</span>${deviceNames[d] || d}</span></td>
          <td class="text-sm text-secondary" style="font-family:monospace;">${escapeHtml(v.ip || '-')}</td>
        </tr>`;
      }).join('');

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const container = document.getElementById('pagination');
      if (totalPages <= 1) { container.innerHTML = ''; return; }

      let html = '';
      html += `<button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>‹</button>`;

      const maxVisible = 5;
      let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
      let endPage = Math.min(totalPages, startPage + maxVisible - 1);
      if (endPage - startPage < maxVisible - 1) {
        startPage = Math.max(1, endPage - maxVisible + 1);
      }

      if (startPage > 1) {
        html += `<button class="page-btn" onclick="goToPage(1)">1</button>`;
        if (startPage > 2) html += `<span class="page-info">...</span>`;
      }

      for (let i = startPage; i <= endPage; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      }

      if (endPage < totalPages) {
        if (endPage < totalPages - 1) html += `<span class="page-info">...</span>`;
        html += `<button class="page-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`;
      }

      html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>›</button>`;
      html += `<span class="page-info">共 ${searchedVisits.length} 条</span>`;

      container.innerHTML = html;
    }

    function goToPage(page) {
      currentPage = page;
      renderVisitTable();
    }

    // ============================================================
    // CSV 导出
    // ============================================================
    function exportCSV() {
      const dataToExport = searchedVisits.length > 0 ? searchedVisits : filteredVisits;
      if (dataToExport.length === 0) {
        showToast('暂无数据可导出', 'info');
        return;
      }

      const deviceNames = { mobile: '移动端', desktop: '桌面端', tablet: '平板' };
      const BOM = '\uFEFF';
      let csv = BOM + '时间,页面,设备类型,IP地址\n';

      dataToExport.forEach(v => {
        const time = v.created_at ? new Date(v.created_at).toLocaleString('zh-CN') : '-';
        const path = (v.path || '/').replace(/"/g, '""');
        const device = deviceNames[v.device_type] || v.device_type || '桌面端';
        const ip = (v.ip || '-').replace(/"/g, '""');
        csv += `"${time}","${path}","${device}","${ip}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      const dateStr = new Date().toISOString().split('T')[0];
      link.download = `访问统计_${dateStr}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      showToast(`已导出 ${dataToExport.length} 条记录`, 'success');
    }

    // ============================================================
    // 自动刷新
    // ============================================================
    function startAutoRefresh() {
      countdown = 60;
      updateCountdownDisplay();

      if (countdownTimer) clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
          countdown = 60;
          loadAllData();
        }
        updateCountdownDisplay();
      }, 1000);
    }

    function updateCountdownDisplay() {
      const el = document.getElementById('refreshCountdown');
      if (el) el.textContent = `${countdown}s 后刷新`;
    }

    // ============================================================
    // 启动
    // ============================================================
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
