<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访问统计 - 作业公布站</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .stats-layout {
      padding: 24px 0;
    }

    .page-header {
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      border: 1px solid var(--border-light);
      text-align: center;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-label {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .content-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
      margin-bottom: 20px;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
    }

    .card-body {
      padding: 20px;
    }

    .visit-table {
      width: 100%;
      border-collapse: collapse;
    }

    .visit-table th, .visit-table td {
      padding: 10px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-light);
      font-size: 13px;
    }

    .visit-table th {
      background: var(--bg-hover);
      font-weight: 600;
      color: var(--text-secondary);
    }

    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .visit-table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <header class="header" id="header"></header>

  <main class="container stats-layout">
    <div class="page-header">
      <h1 class="page-title">📊 访问统计</h1>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalVisits">-</div>
        <div class="stat-label">总访问次数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="todayVisits">-</div>
        <div class="stat-label">今日访问</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="weekVisits">-</div>
        <div class="stat-label">本周访问</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="mobileRate">-</div>
        <div class="stat-label">移动端占比</div>
      </div>
    </div>

    <div class="content-card">
      <div class="card-header">
        <span class="card-title">最近访问记录</span>
      </div>
      <div style="overflow-x:auto">
        <table class="visit-table">
          <thead>
            <tr>
              <th>时间</th>
              <th>页面</th>
              <th>设备</th>
              <th>IP</th>
            </tr>
          </thead>
          <tbody id="visitTableBody">
            <tr><td colspan="4" class="loading"><div class="spinner"></div>加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    async function init() {
      initHeader('stats');
      await loadStats();
      recordVisit('/stats');
    }

    async function loadStats() {
      try {
        const data = await API.request('/api/stats/overview');
        if (data.success) {
          const v = data.data.visits;
          document.getElementById('totalVisits').textContent = v.totalVisits;
          document.getElementById('todayVisits').textContent = v.todayVisits;
          document.getElementById('weekVisits').textContent = v.weekVisits;
          
          const mobile = v.deviceStats.find(d => d.device_type === 'mobile')?.count || 0;
          const total = v.totalVisits || 1;
          document.getElementById('mobileRate').textContent = Math.round(mobile / total * 100) + '%';

          const tbody = document.getElementById('visitTableBody');
          const visits = data.data.recentVisits || [];
          
          if (visits.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-state">暂无记录</td></tr>';
            return;
          }

          tbody.innerHTML = visits.map(v => `
            <tr>
              <td>${formatDateTime(v.created_at)}</td>
              <td>${v.path || '/'}</td>
              <td><span class="badge ${v.device_type === 'mobile' ? 'badge-info' : 'badge-primary'}">${v.device_type === 'mobile' ? '📱移动端' : '💻电脑'}</span></td>
              <td class="font-mono text-sm text-secondary">${v.ip || '-'}</td>
            </tr>
          `).join('');
        }
      } catch (e) {
        document.getElementById('visitTableBody').innerHTML = '<tr><td colspan="4" class="text-center text-muted">请登录后查看详细统计</td></tr>';
        document.querySelectorAll('.stat-value').forEach(el => el.textContent = '-');
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
