<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>南通市崇川初级中学作业公布站</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .hero {
      padding: 60px 0 40px;
      text-align: center;
    }

    .school-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: var(--radius-full);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .hero h1 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 16px;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto 40px;
    }

    .grade-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-bottom: 40px;
    }

    .grade-card {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 32px 24px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
      transition: var(--transition);
      cursor: pointer;
    }

    .grade-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }

    .grade-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .grade-card:nth-child(1) .grade-icon { background: linear-gradient(135deg, #667eea, #764ba2); }
    .grade-card:nth-child(2) .grade-icon { background: linear-gradient(135deg, #f093fb, #f5576c); }
    .grade-card:nth-child(3) .grade-icon { background: linear-gradient(135deg, #4facfe, #00f2fe); }

    .grade-name {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .grade-desc {
      font-size: 14px;
      color: var(--text-muted);
    }

    .class-section {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .class-section.show {
      display: block;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      color: var(--text-secondary);
      cursor: pointer;
      margin-bottom: 20px;
      background: none;
      font-size: 14px;
    }

    .back-btn:hover {
      color: var(--primary);
    }

    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }

    .class-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px 16px;
      text-align: center;
      border: 1px solid var(--border);
      transition: var(--transition);
      cursor: pointer;
    }

    .class-card:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      transform: scale(1.02);
    }

    .class-number {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .class-label {
      font-size: 13px;
      color: var(--text-muted);
    }

    .quick-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 40px;
      flex-wrap: wrap;
    }

    .quick-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
    }

    .quick-action:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-top: 60px;
      padding: 40px 0;
      border-top: 1px solid var(--border);
    }

    .feature-item {
      text-align: center;
    }

    .feature-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .feature-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .feature-desc {
      font-size: 13px;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 28px; }
      .grade-grid { grid-template-columns: 1fr; gap: 16px; }
      .features { grid-template-columns: repeat(2, 1fr); gap: 24px; }
      .class-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header class="header" id="header"></header>

  <main class="container">
    <section class="hero" id="heroSection">
      <div class="school-badge">🎓 南通市崇川初级中学</div>
      <h1>作业公布站</h1>
      <p>便捷查看每日作业，支持实时更新，让学习更高效</p>

      <div class="grade-grid" id="gradeGrid">
      </div>

      <div class="quick-actions">
        <a href="/login" class="quick-action">
          <span>🔐</span> 教师/管理员登录
        </a>
        <a href="/stats" class="quick-action">
          <span>📊</span> 访问统计
        </a>
      </div>
    </section>

    <section class="class-section" id="classSection">
      <button class="back-btn" onclick="showGrades()">
        ← 返回选择年级
      </button>
      <h2 class="text-xl mb-20" id="currentGradeTitle">选择班级</h2>
      <div class="class-grid" id="classGrid">
      </div>
    </section>

    <section class="features">
      <div class="feature-item">
        <div class="feature-icon">📱</div>
        <div class="feature-title">多端适配</div>
        <div class="feature-desc">手机电脑均可使用</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">⚡</div>
        <div class="feature-title">实时更新</div>
        <div class="feature-desc">WebSocket即时推送</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">🌙</div>
        <div class="feature-title">深色模式</div>
        <div class="feature-desc">保护视力舒适阅读</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">📎</div>
        <div class="feature-title">附件支持</div>
        <div class="feature-desc">支持文件图片上传</div>
      </div>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script>
    let gradesData = [];
    let currentGrade = null;

    async function init() {
      initHeader('home');
      await loadGrades();
      recordVisit('/');
    }

    async function loadGrades() {
      try {
        const data = await API.get('/api/config');
        gradesData = data.data.grades;
        
        const grid = document.getElementById('gradeGrid');
        grid.innerHTML = gradesData.map((grade, index) => `
          <div class="grade-card" onclick="showClasses(${grade.id}, '${grade.name}', '${grade.fullName}')">
            <div class="grade-icon">${['🌱', '🌿', '🌳'][index]}</div>
            <div class="grade-name">${grade.fullName}</div>
            <div class="grade-desc">点击查看班级</div>
          </div>
        `).join('');

        await loadAllClasses();
      } catch (e) {
        showToast('加载数据失败', 'error');
      }
    }

    async function loadAllClasses() {
      try {
        for (const grade of gradesData) {
          const res = await API.get(`/api/grades/${grade.id}/classes`);
          grade.classes = res.data || [];
        }
      } catch (e) {
        console.error(e);
      }
    }

    function showClasses(gradeId, gradeName, gradeFullName) {
      currentGrade = gradesData.find(g => g.id === gradeId);
      document.getElementById('heroSection').style.display = 'none';
      document.getElementById('classSection').classList.add('show');
      document.getElementById('currentGradeTitle').textContent = `${gradeFullName} - 请选择班级`;
      
      const grid = document.getElementById('classGrid');
      if (currentGrade.classes && currentGrade.classes.length > 0) {
        grid.innerHTML = currentGrade.classes.map(cls => `
          <div class="class-card" onclick="goToStudent(${gradeId}, '${cls.id}', '${cls.class_name}')">
            <div class="class-number">${cls.class_number}</div>
            <div class="class-label">${cls.class_name}</div>
          </div>
        `).join('');
      } else {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📭</div><div class="empty-text">暂无班级，请管理员先创建班级</div></div>';
      }
    }

    function showGrades() {
      document.getElementById('heroSection').style.display = 'block';
      document.getElementById('classSection').classList.remove('show');
    }

    function goToStudent(gradeId, classId, className) {
      window.location.href = `/student?gradeId=${gradeId}&classId=${classId}&className=${encodeURIComponent(className)}`;
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
