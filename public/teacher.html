<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教师端 - 作业公布站</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .teacher-layout {
      padding: 24px 0;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome-text {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 8px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      border: 1px solid var(--border-light);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      opacity: 0;
      transition: var(--transition);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .stat-card:hover::before {
      opacity: 1;
    }

    .stat-card:nth-child(1)::before { background: linear-gradient(90deg, #4B3FE3, #8B5CF6); }
    .stat-card:nth-child(2)::before { background: linear-gradient(90deg, #22A5F7, #06B6D4); }
    .stat-card:nth-child(3)::before { background: linear-gradient(90deg, #1DC981, #27D2BF); }
    .stat-card:nth-child(4)::before { background: linear-gradient(90deg, #F87454, #EFAA17); }

    .stat-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .content-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .content-card:hover {
      box-shadow: var(--shadow-md);
    }

    .card-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: linear-gradient(135deg, var(--bg-hover) 0%, transparent 100%);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-select {
      padding: 8px 12px;
      font-size: 13px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .homework-table {
      width: 100%;
      border-collapse: collapse;
    }

    .homework-table th,
    .homework-table td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-light);
      font-size: 14px;
    }

    .homework-table th {
      background: var(--bg-hover);
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .homework-table tr:hover td {
      background: var(--bg-hover);
    }

    .homework-table tr:last-child td {
      border-bottom: none;
    }

    .action-btns {
      display: flex;
      gap: 6px;
    }

    .btn-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: var(--text-muted);
      font-size: 16px;
      transition: var(--transition);
      border: none;
      cursor: pointer;
    }

    .btn-icon:hover {
      background: var(--bg-hover);
      color: var(--primary);
      transform: scale(1.1);
    }

    .btn-icon.danger:hover {
      background: rgba(232, 70, 58, 0.1);
      color: var(--danger);
    }

    .editor-section {
      display: none;
      padding: 24px;
    }

    .editor-section.show {
      display: block;
    }

    .links-editor, .attachments-editor {
      margin-top: 12px;
    }

    .link-item-edit, .attachment-item-edit {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .link-item-edit input, .attachment-item-edit input {
      flex: 1;
    }

    .file-upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 12px;
    }

    .file-upload-area:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .file-upload-area.dragover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.6;
    }

    .uploaded-files {
      margin-top: 12px;
    }

    .uploaded-file {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-hover);
      border-radius: var(--radius);
      margin-bottom: 8px;
      font-size: 13px;
      transition: var(--transition);
    }

    .uploaded-file:hover {
      background: var(--primary-soft);
    }

    .notice-editor {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border-light);
    }

    .form-check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .form-check input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    .form-check label {
      font-size: 14px;
      cursor: pointer;
    }

    .tabs-container {
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-hover);
      padding: 4px;
      border-radius: var(--radius-lg);
      width: fit-content;
    }

    .tab {
      padding: 10px 20px;
      border: none;
      background: transparent;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: var(--transition);
    }

    .tab:hover {
      color: var(--text-primary);
    }

    .tab.active {
      background: var(--bg-card);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .notice-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid var(--primary);
      transition: var(--transition);
    }

    .notice-card:hover {
      transform: translateX(4px);
      box-shadow: var(--shadow-sm);
    }

    .notice-card.urgent {
      border-left-color: var(--danger);
      background: linear-gradient(135deg, rgba(232, 70, 58, 0.05) 0%, transparent 100%);
    }

    .notice-card.announcement {
      border-left-color: #EFAA17;
      background: linear-gradient(135deg, rgba(239, 170, 23, 0.05) 0%, transparent 100%);
    }

    .notice-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .notice-title {
      font-weight: 600;
      font-size: 15px;
    }

    .notice-time {
      font-size: 12px;
      color: var(--text-muted);
    }

    .notice-content {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 500;
    }

    .badge-danger {
      background: rgba(232, 70, 58, 0.1);
      color: var(--danger);
    }

    .badge-warning {
      background: rgba(239, 170, 23, 0.1);
      color: #EFAA17;
    }

    .badge-info {
      background: var(--primary-soft);
      color: var(--primary);
    }

    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .homework-table {
        display: block;
        overflow-x: auto;
      }

      .stat-value {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <header class="header" id="header"></header>

  <main class="container teacher-layout">
    <div class="page-header">
      <div>
        <h1 class="page-title">作业管理</h1>
        <p class="welcome-text" id="welcomeText">欢迎使用教师端</p>
      </div>
      <div class="flex gap-8">
        <button class="btn btn-outline" onclick="switchTab('notice')">📢 发布公告</button>
        <button class="btn btn-primary" onclick="openHomeworkModal()">✏️ 发布新作业</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">📝</div>
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">累计发布作业</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📅</div>
        <div class="stat-value" id="statMonth">0</div>
        <div class="stat-label">本月发布</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👁️</div>
        <div class="stat-value" id="statViews">0</div>
        <div class="stat-label">总查看次数</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🏫</div>
        <div class="stat-value" id="statClasses">0</div>
        <div class="stat-label">所教班级</div>
      </div>
    </div>

    <div class="tabs-container">
      <div class="tabs">
        <button class="tab active" data-tab="homework" onclick="switchTab('homework')">📝 作业管理</button>
        <button class="tab" data-tab="notice" onclick="switchTab('notice')">📢 公告管理</button>
      </div>
    </div>

    <div id="homeworkTab">
      <div class="content-card">
        <div class="card-header">
          <span class="card-title">📋 作业列表</span>
          <div class="filter-group">
            <select class="filter-select" id="gradeFilter" onchange="onGradeChange()">
              <option value="">全部年级</option>
            </select>
            <select class="filter-select" id="classFilter" onchange="loadHomework()">
              <option value="">全部班级</option>
            </select>
          </div>
        </div>
        <div style="overflow-x:auto">
          <table class="homework-table">
            <thead>
              <tr>
                <th>科目</th>
                <th>作业标题</th>
                <th>班级</th>
                <th>发布时间</th>
                <th>查看</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="homeworkTableBody">
              <tr><td colspan="6" class="loading"><div class="spinner"></div>加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="noticeTab" style="display:none">
      <div class="content-card">
        <div class="card-header">
          <span class="card-title">📢 公告列表</span>
        </div>
        <div style="padding:24px">
          <div id="noticeList" style="margin-bottom:24px"></div>
          <div class="notice-editor">
            <h3 style="font-size:18px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px">
              <span>✨</span> 发布新公告
            </h3>
            <div class="form-group">
              <label class="form-label">公告标题</label>
              <input type="text" class="form-control" id="noticeTitle" placeholder="请输入公告标题">
            </div>
            <div class="form-row" style="grid-template-columns:repeat(2,1fr)">
              <div class="form-group">
                <label class="form-label">公告类型</label>
                <select class="form-control" id="noticeType">
                  <option value="notice">📋 普通通知</option>
                  <option value="announcement">⚠️ 重要公告</option>
                  <option value="urgent">🚨 紧急通知</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">发布范围</label>
                <select class="form-control" id="noticeScope" onchange="onNoticeScopeChange()">
                  <option value="all">🌍 全校可见</option>
                  <option value="grade">🎓 指定年级</option>
                  <option value="class">🏫 指定班级</option>
                </select>
              </div>
            </div>
            <div id="noticeGradeWrap" class="form-group" style="display:none">
              <label class="form-label">选择年级</label>
              <select class="form-control" id="noticeGrade" onchange="loadNoticeClasses()">
                <option value="">请选择年级</option>
              </select>
            </div>
            <div id="noticeClassWrap" class="form-group" style="display:none">
              <label class="form-label">选择班级</label>
              <select class="form-control" id="noticeClass">
                <option value="">请选择班级</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">公告内容</label>
              <textarea class="form-control" id="noticeContent" rows="4" placeholder="请输入公告内容..."></textarea>
            </div>
            <button class="btn btn-primary" onclick="publishNotice()">📤 发布公告</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="homeworkModal" style="display:none">
    <div class="modal" style="max-width:720px">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">发布新作业</h3>
        <button class="modal-close" onclick="closeHomeworkModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editingId">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">年级 *</label>
            <select class="form-control" id="hwGrade" onchange="loadHwClasses()">
              <option value="">请选择年级</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">班级 *</label>
            <select class="form-control" id="hwClass">
              <option value="">请先选择年级</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">科目</label>
            <select class="form-control" id="hwSubject">
              <option value="">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">截止日期</label>
            <input type="date" class="form-control" id="hwDeadline">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">作业标题 *</label>
          <input type="text" class="form-control" id="hwTitle" placeholder="例如：第10页练习题">
        </div>
        <div class="form-group">
          <label class="form-label">作业内容 *</label>
          <textarea class="form-control" id="hwContent" rows="6" placeholder="请详细描述作业内容..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">相关链接</label>
          <div class="links-editor" id="linksEditor">
            <div class="link-item-edit">
              <input type="text" id="linkName" placeholder="链接名称" style="max-width:120px">
              <input type="url" id="linkUrl" placeholder="https://...">
              <button type="button" class="btn btn-primary btn-sm" onclick="addLink()">添加</button>
            </div>
            <div id="linksList"></div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">上传附件</label>
          <div class="file-upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📁</div>
            <div>点击或拖拽文件到这里上传</div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:4px">支持图片、文档、压缩包等，单个文件最大50MB</div>
          </div>
          <input type="file" id="fileInput" multiple style="display:none" onchange="handleFileUpload(this.files)">
          <div class="uploaded-files" id="uploadedFiles"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeHomeworkModal()">取消</button>
        <button class="btn btn-primary" onclick="saveHomework()" id="saveBtn">发布作业</button>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    let gradesData = [];
    let subjects = [];
    let currentLinks = [];
    let currentAttachments = [];
    let editingId = null;

    async function init() {
      if (!API.isLoggedIn() || !API.hasRole('super_admin', 'admin', 'teacher')) {
        window.location.href = '/login';
        return;
      }
      
      initHeader('teacher');
      document.getElementById('welcomeText').textContent = `欢迎您，${API.user.realName}老师 👋`;
      
      await Promise.all([loadGrades(), loadSubjects()]);
      initFilters();
      initUpload();
      loadHomework();
      loadNotices();
      recordVisit('/teacher');
    }

    async function loadGrades() {
      try {
        const data = await API.get('/api/grades/classes/all');
        gradesData = data.data || [];
      } catch (e) {
        const data = await API.get('/api/grades');
        gradesData = (data.data || []).map(g => ({ ...g, classes: [] }));
      }
      
      const gradeSelects = ['gradeFilter', 'hwGrade', 'noticeGrade'];
      gradeSelects.forEach(id => {
        const sel = document.getElementById(id);
        if (sel) {
          const isFilter = id === 'gradeFilter';
          sel.innerHTML = '<option value="">' + (isFilter ? '全部年级' : '请选择年级') + '</option>';
          gradesData.forEach(g => {
            sel.innerHTML += `<option value="${g.id}">${g.fullName || g.name}</option>`;
          });
        }
      });
    }

    async function loadSubjects() {
      try {
        const data = await API.get('/api/grades/subjects');
        subjects = data.data || [];
      } catch (e) {
        subjects = [];
      }
      const sel = document.getElementById('hwSubject');
      sel.innerHTML = '<option value="">其他</option>';
      subjects.forEach(s => {
        sel.innerHTML += `<option value="${s.id}">${s.name}</option>`;
      });
    }

    function initFilters() {
      if (API.user.gradeId) {
        document.getElementById('gradeFilter').value = API.user.gradeId;
        loadClasses('gradeFilter', 'classFilter');
      }
    }

    function onGradeChange() {
      loadClasses('gradeFilter', 'classFilter');
      loadHomework();
    }

    async function loadClasses(gradeSelId, classSelId, includeAll = true) {
      const gradeId = document.getElementById(gradeSelId).value;
      const classSel = document.getElementById(classSelId);
      
      if (!gradeId) {
        classSel.innerHTML = '<option value="">' + (includeAll ? '全部班级' : '请选择班级') + '</option>';
        return;
      }
      
      const grade = gradesData.find(g => g.id === gradeId || g.id === parseInt(gradeId));
      classSel.innerHTML = '<option value="">' + (includeAll ? '全部班级' : '请选择班级') + '</option>';
      (grade?.classes || []).forEach(c => {
        classSel.innerHTML += `<option value="${c.id}">${c.class_name || c.name}</option>`;
      });
    }

    async function loadHwClasses() {
      await loadClasses('hwGrade', 'hwClass', false);
    }

    async function loadNoticeClasses() {
      const scope = document.getElementById('noticeScope').value;
      document.getElementById('noticeGradeWrap').style.display = (scope === 'grade' || scope === 'class') ? 'block' : 'none';
      document.getElementById('noticeClassWrap').style.display = scope === 'class' ? 'block' : 'none';
      
      if (scope !== 'grade' && scope !== 'class') return;
      
      await loadClasses('noticeGrade', 'noticeClass', false);
    }

    function onNoticeScopeChange() {
      loadNoticeClasses();
    }

    async function loadHomework() {
      const gradeId = document.getElementById('gradeFilter').value;
      const classId = document.getElementById('classFilter').value;
      
      let url = '/api/homework?pageSize=100';
      if (gradeId) url += `&gradeId=${gradeId}`;
      if (classId) url += `&classId=${classId}`;
      
      try {
        const data = await API.get(url);
        const list = data.data.list || data.data.homework || [];
        renderHomeworkTable(list);
        updateStats(list);
      } catch (e) {
        document.getElementById('homeworkTableBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger">加载失败，请刷新重试</td></tr>`;
      }
    }

    function renderHomeworkTable(list) {
      const tbody = document.getElementById('homeworkTableBody');
      if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无作业，点击右上角发布</div></div></td></tr>';
        return;
      }
      
      tbody.innerHTML = list.map(h => `
        <tr>
          <td><span class="badge badge-info" style="background:${getSubjectColor(h.subject_name || h.subjectName)}20;color:${getSubjectColor(h.subject_name || h.subjectName)}">${h.subject_name || h.subjectName || '其他'}</span></td>
          <td style="font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.title}</td>
          <td style="font-size:13px;color:var(--text-secondary)">${h.grade_name || h.gradeName || ''} ${h.class_name || h.className || ''}</td>
          <td style="font-size:13px;color:var(--text-secondary)">${formatDateTime(h.created_at)}</td>
          <td style="font-size:13px">👁 ${h.view_count || h.viewCount || 0}</td>
          <td>
            <div class="action-btns">
              <button class="btn-icon" onclick="viewHomework('${h.id}')" title="查看">👁</button>
              <button class="btn-icon" onclick="editHomework('${h.id}')" title="编辑">✏️</button>
              <button class="btn-icon danger" onclick="deleteHomework('${h.id}')" title="删除">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function updateStats(list) {
      const now = new Date();
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      
      document.getElementById('statTotal').textContent = list.length;
      document.getElementById('statMonth').textContent = list.filter(h => new Date(h.created_at) >= monthStart).length;
      document.getElementById('statViews').textContent = list.reduce((sum, h) => sum + (h.view_count || h.viewCount || 0), 0);
      document.getElementById('statClasses').textContent = new Set(list.map(h => h.class_id || h.classId)).size;
    }

    function openHomeworkModal(id = null) {
      editingId = id;
      currentLinks = [];
      currentAttachments = [];
      renderLinks();
      renderAttachments();
      
      if (id) {
        document.getElementById('modalTitle').textContent = '✏️ 编辑作业';
        document.getElementById('saveBtn').textContent = '保存修改';
        loadHomeworkForEdit(id);
      } else {
        document.getElementById('modalTitle').textContent = '✏️ 发布新作业';
        document.getElementById('saveBtn').textContent = '发布作业';
        document.getElementById('editingId').value = '';
        document.getElementById('hwTitle').value = '';
        document.getElementById('hwContent').value = '';
        document.getElementById('hwDeadline').value = '';
        document.getElementById('hwSubject').value = API.user.subjectId || '';
        if (API.user.gradeId) {
          document.getElementById('hwGrade').value = API.user.gradeId;
          loadHwClasses();
          if (API.user.classId) {
            setTimeout(() => {
              document.getElementById('hwClass').value = API.user.classId;
            }, 100);
          }
        }
      }
      
      document.getElementById('homeworkModal').style.display = 'flex';
    }

    function closeHomeworkModal() {
      document.getElementById('homeworkModal').style.display = 'none';
    }

    async function loadHomeworkForEdit(id) {
      try {
        const data = await API.get(`/api/homework/${id}`);
        const h = data.data;
        document.getElementById('editingId').value = id;
        document.getElementById('hwGrade').value = h.grade_id || h.gradeId;
        await loadHwClasses();
        document.getElementById('hwClass').value = h.class_id || h.classId;
        document.getElementById('hwSubject').value = h.subject_id || h.subjectId || '';
        document.getElementById('hwTitle').value = h.title;
        document.getElementById('hwContent').value = h.content;
        document.getElementById('hwDeadline').value = h.deadline ? (h.deadline.split ? h.deadline.split('T')[0] : h.deadline) : '';
        currentLinks = h.links || [];
        currentAttachments = h.attachments || [];
        renderLinks();
        renderAttachments();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    function addLink() {
      const name = document.getElementById('linkName').value.trim();
      const url = document.getElementById('linkUrl').value.trim();
      if (!url) {
        showToast('请输入链接地址', 'error');
        return;
      }
      currentLinks.push({ name: name || url, url });
      document.getElementById('linkName').value = '';
      document.getElementById('linkUrl').value = '';
      renderLinks();
    }

    function removeLink(index) {
      currentLinks.splice(index, 1);
      renderLinks();
    }

    function renderLinks() {
      const container = document.getElementById('linksList');
      if (!currentLinks || currentLinks.length === 0) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = currentLinks.map((l, i) => `
        <div class="link-item-edit">
          <span style="flex:1">🔗 ${l.name}</span>
          <button type="button" class="btn btn-outline btn-sm" onclick="removeLink(${i})">删除</button>
        </div>
      `).join('');
    }

    function initUpload() {
      const area = document.getElementById('uploadArea');
      area.addEventListener('dragover', (e) => { e.preventDefault(); area.classList.add('dragover'); });
      area.addEventListener('dragleave', () => area.classList.remove('dragover'));
      area.addEventListener('drop', (e) => {
        e.preventDefault();
        area.classList.remove('dragover');
        handleFileUpload(e.dataTransfer.files);
      });
    }

    async function handleFileUpload(files) {
      for (const file of files) {
        try {
          const data = await API.uploadFile(file);
          if (data.success) {
            currentAttachments.push(data.data);
          }
        } catch (e) {
          showToast(`上传 ${file.name} 失败`, 'error');
        }
      }
      renderAttachments();
    }

    function removeAttachment(index) {
      currentAttachments.splice(index, 1);
      renderAttachments();
    }

    function renderAttachments() {
      const container = document.getElementById('uploadedFiles');
      if (!currentAttachments || currentAttachments.length === 0) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = currentAttachments.map((a, i) => `
        <div class="uploaded-file">
          <span>📎 ${a.name}</span>
          <button type="button" class="btn btn-outline btn-sm" onclick="removeAttachment(${i})">移除</button>
        </div>
      `).join('');
    }

    async function saveHomework() {
      const gradeId = document.getElementById('hwGrade').value;
      const classId = document.getElementById('hwClass').value;
      const subjectId = document.getElementById('hwSubject').value;
      const subjectName = document.getElementById('hwSubject').selectedOptions[0]?.textContent;
      const title = document.getElementById('hwTitle').value.trim();
      const content = document.getElementById('hwContent').value.trim();
      const deadline = document.getElementById('hwDeadline').value;

      if (!gradeId || !classId || !title || !content) {
        showToast('请填写必填项（带*的字段）', 'error');
        return;
      }

      const payload = {
        gradeId: gradeId,
        classId: classId,
        subjectId: subjectId || null,
        subjectName: subjectId ? subjectName : '其他',
        title,
        content,
        deadline: deadline || null,
        links: currentLinks,
        attachments: currentAttachments
      };

      try {
        if (editingId) {
          await API.put(`/api/homework/${editingId}`, payload);
          showToast('作业更新成功 ✅', 'success');
        } else {
          await API.post('/api/homework', payload);
          showToast('作业发布成功 ✅', 'success');
        }
        closeHomeworkModal();
        loadHomework();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    function editHomework(id) {
      openHomeworkModal(id);
    }

    async function deleteHomework(id) {
      if (!await showModal({ title: '确认删除', content: '确定要删除这份作业吗？此操作不可恢复。' })) return;
      try {
        await API.delete(`/api/homework/${id}`);
        showToast('删除成功', 'success');
        loadHomework();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    function viewHomework(id) {
      const gradeId = document.getElementById('gradeFilter').value || '';
      const classId = document.getElementById('classFilter').value || '';
      window.open(`/student?gradeId=${gradeId}&classId=${classId}#${id}`, '_blank');
    }

    async function loadNotices() {
      try {
        const data = await API.get('/api/notices?pageSize=100');
        const list = data.data.list || data.data.notices || [];
        renderNotices(list);
      } catch (e) {
        console.error(e);
        document.getElementById('noticeList').innerHTML = '<div class="text-danger">加载公告失败</div>';
      }
    }

    function renderNotices(list) {
      const container = document.getElementById('noticeList');
      if (!list || list.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">📢</div><div class="empty-text">暂无公告</div></div>';
        return;
      }
      
      container.innerHTML = list.map(n => `
        <div class="notice-card ${n.type === 'urgent' ? 'urgent' : n.type === 'announcement' ? 'announcement' : ''}">
          <div class="notice-header">
            <div style="display:flex;align-items:center;gap:8px">
              <span class="badge ${n.type === 'urgent' ? 'badge-danger' : n.type === 'announcement' ? 'badge-warning' : 'badge-info'}">
                ${n.type === 'urgent' ? '紧急' : n.type === 'announcement' ? '重要' : '通知'}
              </span>
              <span class="notice-title">${n.title}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <span class="notice-time">${formatDateTime(n.created_at)}</span>
              <button class="btn-icon danger" onclick="deleteNotice('${n.id}')" title="删除">🗑️</button>
            </div>
          </div>
          <div class="notice-content">${n.content}</div>
        </div>
      `).join('');
    }

    async function publishNotice() {
      const title = document.getElementById('noticeTitle').value.trim();
      const content = document.getElementById('noticeContent').value.trim();
      const type = document.getElementById('noticeType').value;
      const scope = document.getElementById('noticeScope').value;
      const gradeId = document.getElementById('noticeGrade').value;
      const classId = document.getElementById('noticeClass').value;

      if (!title || !content) {
        showToast('请填写标题和内容', 'error');
        return;
      }

      try {
        await API.post('/api/notices', {
          title,
          content,
          type,
          scope,
          gradeId: scope === 'all' ? null : (gradeId || null),
          classId: scope === 'class' ? classId : null,
          isAllGrades: scope === 'all',
          isAllClasses: scope !== 'class'
        });
        showToast('公告发布成功 ✅', 'success');
        document.getElementById('noticeTitle').value = '';
        document.getElementById('noticeContent').value = '';
        loadNotices();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    async function deleteNotice(id) {
      if (!await showModal({ title: '确认删除', content: '确定要删除这条公告吗？' })) return;
      try {
        await API.delete(`/api/notices/${id}`);
        showToast('删除成功', 'success');
        loadNotices();
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      document.getElementById('homeworkTab').style.display = tab === 'homework' ? 'block' : 'none';
      document.getElementById('noticeTab').style.display = tab === 'notice' ? 'block' : 'none';
    }

    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('modal-overlay')) {
        closeHomeworkModal();
      }
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
