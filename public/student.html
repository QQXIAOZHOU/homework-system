<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生端 - 作业公布站</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .student-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 20px;
      padding: 20px 0;
    }

    .sidebar-card {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 20px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      height: fit-content;
      position: sticky;
      top: 84px;
    }

    .sidebar-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .class-select-group {
      margin-bottom: 16px;
    }

    .class-select-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .class-select {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 14px;
      cursor: pointer;
      color: var(--text-primary);
    }

    .quick-links {
      border-top: 1px solid var(--border);
      padding-top: 16px;
      margin-top: 16px;
    }

    .quick-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius);
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }

    .quick-link:hover {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .main-content {
      min-width: 0;
    }

    .page-header {
      margin-bottom: 20px;
    }

    .page-title {
      font-size: 26px;
      font-weight: 700;
    }

    .page-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .live-indicator {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--success);
      margin-top: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .notice-banner {
      background: linear-gradient(135deg, var(--warning), #F59E0B);
      color: white;
      padding: 16px 20px;
      border-radius: var(--radius-lg);
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 7px 14px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .homework-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 12px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .homework-card:hover {
      box-shadow: var(--shadow);
      border-color: var(--border);
    }

    .homework-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .subject-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
    }

    .homework-title {
      font-size: 17px;
      font-weight: 600;
      margin-top: 8px;
      line-height: 1.4;
    }

    .homework-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .homework-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .homework-content {
      font-size: 14px;
      line-height: 1.8;
      color: var(--text-secondary);
      white-space: pre-wrap;
    }

    .homework-content.collapsed {
      max-height: 80px;
      overflow: hidden;
      position: relative;
    }

    .homework-content.collapsed::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(transparent, var(--bg-card));
    }

    .expand-btn {
      background: none;
      color: var(--primary);
      font-size: 13px;
      padding: 4px 0;
      margin-top: 8px;
      font-weight: 500;
    }

    .attachments-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .attachment-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--bg-hover);
      border-radius: var(--radius);
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: var(--transition);
    }

    .attachment-item:hover {
      background: var(--primary-soft);
      color: var(--primary);
    }

    @media (max-width: 768px) {
      .student-layout {
        grid-template-columns: 1fr;
      }
      .sidebar-card {
        position: static;
      }
    }
  </style>
</head>
<body>
  <header class="header" id="header"></header>

  <main class="container">
    <div class="student-layout">
      <aside>
        <div class="sidebar-card">
          <div class="sidebar-title">🏫 选择班级</div>
          
          <div class="class-select-group">
            <label>年级</label>
            <select class="class-select" id="gradeSelect" onchange="onGradeChange()">
              <option value="">请选择年级</option>
            </select>
          </div>
          <div class="class-select-group">
            <label>班级</label>
            <select class="class-select" id="classSelect" onchange="onClassChange()">
              <option value="">请选择班级</option>
            </select>
          </div>

          <div class="quick-links">
            <a href="/timetable" class="quick-link">
              <span>📅</span> 查看课程表
            </a>
            <a href="/" class="quick-link">
              <span>🏠</span> 返回首页
            </a>
          </div>
        </div>
      </aside>

      <div class="main-content">
        <div class="page-header">
          <h1 class="page-title" id="pageTitle">作业列表</h1>
          <div class="page-subtitle" id="pageSubtitle">请从左侧选择班级查看作业</div>
          <div class="live-indicator" id="liveIndicator">
            <span class="live-dot"></span>
            实时连接中
          </div>
        </div>

        <div id="noticeContainer"></div>

        <div class="filter-bar" id="filterBar" style="display:none">
          <button class="filter-btn active" data-filter="all">全部科目</button>
        </div>

        <div id="homeworkList">
          <div class="empty-state">
            <div class="empty-icon">📖</div>
            <div class="empty-text">请选择年级和班级查看作业</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    let gradesData = [];
    let currentGradeId = null;
    let currentClassId = null;
    let currentClassName = '';
    let currentFilter = 'all';
    let ws = null;
    let allHomework = [];
    let allNotices = [];

    async function init() {
      initHeader('student');
      recordVisit('/student');
      await loadGrades();
      
      const urlParams = new URLSearchParams(window.location.search);
      const gradeId = urlParams.get('gradeId');
      const classId = urlParams.get('classId');
      const className = urlParams.get('className');
      
      if (gradeId && classId) {
        selectClass(gradeId, classId, decodeURIComponent(className || ''));
      } else if (API.user?.classId) {
        selectClass(String(API.user.gradeId), String(API.user.classId), API.user.className || '');
      }
    }

    async function loadGrades() {
      try {
        const data = await API.get('/api/grades/classes/all');
        gradesData = data.data || [];
        
        const gradeSelect = document.getElementById('gradeSelect');
        gradesData.forEach(g => {
          const opt = document.createElement('option');
          opt.value = g.id;
          opt.textContent = g.name;
          gradeSelect.appendChild(opt);
        });
      } catch (e) {
        showToast('加载年级失败', 'error');
      }
    }

    function onGradeChange() {
      const gradeId = document.getElementById('gradeSelect').value;
      const classSelect = document.getElementById('classSelect');
      classSelect.innerHTML = '<option value="">请选择班级</option>';
      currentGradeId = gradeId;
      
      if (gradeId) {
        const grade = gradesData.find(g => String(g.id) === String(gradeId));
        if (grade?.classes) {
          [...grade.classes].sort((a,b) => a.class_num - b.class_num).forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.name;
            classSelect.appendChild(opt);
          });
        }
      }
    }

    function onClassChange() {
      const classId = document.getElementById('classSelect').value;
      if (classId && currentGradeId) {
        const grade = gradesData.find(g => String(g.id) === String(currentGradeId));
        const cls = grade?.classes?.find(c => String(c.id) === String(classId));
        selectClass(String(currentGradeId), String(classId), cls?.name || '');
      }
    }

    async function selectClass(gradeId, classId, className) {
      currentGradeId = String(gradeId);
      currentClassId = String(classId);
      currentClassName = className;
      
      const gradeSelect = document.getElementById('gradeSelect');
      gradeSelect.value = currentGradeId;
      onGradeChange();
      
      const classSelect = document.getElementById('classSelect');
      classSelect.value = currentClassId;
      
      document.getElementById('pageTitle').textContent = className || '作业列表';
      document.getElementById('pageSubtitle').textContent = '每日作业与公告';
      document.getElementById('filterBar').style.display = 'flex';
      document.getElementById('liveIndicator').style.display = 'inline-flex';
      
      await loadHomeworkAndNotices();
      connectWS();
      
      const newUrl = new URL(window.location);
      newUrl.searchParams.set('gradeId', currentGradeId);
      newUrl.searchParams.set('classId', currentClassId);
      if (className) newUrl.searchParams.set('className', encodeURIComponent(className));
      window.history.replaceState({}, '', newUrl);
    }

    async function loadHomeworkAndNotices() {
      if (!currentClassId) return;
      
      document.getElementById('homeworkList').innerHTML = '<div class="loading"><div class="spinner"></div>加载作业中...</div>';
      
      try {
        const [homeworkRes, noticesRes] = await Promise.all([
          API.get(`/api/homework?class_id=${currentClassId}&pageSize=100`),
          API.get(`/api/notices?class_id=${currentClassId}&pageSize=20`)
        ]);
        
        allHomework = homeworkRes.data?.list || homeworkRes.data?.homework || [];
        allNotices = noticesRes.data?.list || noticesRes.data?.notices || [];
        
        renderNotices();
        renderSubjectFilters();
        renderHomework();
      } catch (e) {
        showToast('加载失败', 'error');
        document.getElementById('homeworkList').innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-text">加载失败，请刷新重试</div></div>';
      }
    }

    function renderSubjectFilters() {
      const subjects = [...new Set(allHomework.map(h => h.subjectName).filter(Boolean))];
      const bar = document.getElementById('filterBar');
      bar.innerHTML = `
        <button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">全部科目</button>
        ${subjects.map(s => `
          <button class="filter-btn ${currentFilter === s ? 'active' : ''}" onclick="setFilter('${s}')">${s}</button>
        `).join('')}
      `;
    }

    function setFilter(filter) {
      currentFilter = filter;
      renderSubjectFilters();
      renderHomework();
    }

    function renderHomework() {
      const container = document.getElementById('homeworkList');
      let filtered = allHomework;
      
      if (currentFilter !== 'all') {
        filtered = allHomework.filter(h => h.subjectName === currentFilter);
      }
      
      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无作业</div></div>';
        return;
      }

      container.innerHTML = filtered.map(h => {
        const subjectColor = getSubjectColor(h.subjectName);
        const attachments = h.attachments || [];
        
        return `
          <div class="homework-card">
            <div class="homework-header">
              <div>
                <span class="subject-badge" style="background:${subjectColor}20;color:${subjectColor}">${h.subjectName || '其他'}</span>
                <div class="homework-title">${h.title}</div>
              </div>
            </div>
            <div class="homework-meta">
              <span class="homework-meta-item">👨‍🏫 ${h.teacherName || '未知教师'}</span>
              <span class="homework-meta-item">🕐 ${formatDateTime(h.created_at)}</span>
              ${h.due_date ? `<span class="homework-meta-item">📅 截止: ${h.due_date}</span>` : ''}
            </div>
            <div class="homework-content collapsed" id="content-${h.id}">${h.content}</div>
            <button class="expand-btn" onclick="toggleExpand('${h.id}')" id="expand-${h.id}">展开全文 ▼</button>
            ${attachments.length > 0 ? `
              <div class="attachments-list">
                ${attachments.map(a => `<a href="${a.url || a}" target="_blank" class="attachment-item">📎 ${a.filename || a.name || '附件'}</a>`).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      setTimeout(() => {
        document.querySelectorAll('.homework-content').forEach(el => {
          if (el.scrollHeight <= 90) {
            el.classList.remove('collapsed');
            const btnId = 'expand-' + el.id.replace('content-', '');
            const btn = document.getElementById(btnId);
            if (btn) btn.style.display = 'none';
          } else {
            const btnId = 'expand-' + el.id.replace('content-', '');
            const btn = document.getElementById(btnId);
            if (btn) btn.style.display = 'block';
          }
        });
      }, 50);
    }

    function toggleExpand(id) {
      const content = document.getElementById(`content-${id}`);
      const btn = document.getElementById(`expand-${id}`);
      if (content.classList.contains('collapsed')) {
        content.classList.remove('collapsed');
        btn.textContent = '收起 ▲';
      } else {
        content.classList.add('collapsed');
        btn.textContent = '展开全文 ▼';
      }
    }

    function renderNotices() {
      const container = document.getElementById('noticeContainer');
      const importantNotices = allNotices.filter(n => n.is_important);
      
      if (importantNotices.length === 0) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = importantNotices.map(n => `
        <div class="notice-banner">
          <div style="font-size:20px;flex-shrink:0">📢</div>
          <div style="flex:1">
            <div style="font-weight:600;margin-bottom:4px">${n.title}</div>
            <div style="font-size:13px;opacity:0.9">${n.content}</div>
          </div>
        </div>
      `).join('');
    }

    function connectWS() {
      if (ws) ws.close();
      ws = connectWebSocket(currentGradeId, currentClassId, (data) => {
        if (data.type === 'homework_created' || data.type === 'homework_updated') {
          showToast('📝 作业已更新', 'success');
          loadHomeworkAndNotices();
        } else if (data.type === 'notice_created') {
          showToast('📢 有新公告', 'info');
          loadHomeworkAndNotices();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
