<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生端 - 作业公布站</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    /* === 布局 === */
    .student-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 20px;
      padding: 20px 0;
    }

    /* === Hero 区域 === */
    .hero-area {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      border-radius: var(--radius-xl);
      padding: 28px 32px;
      margin-bottom: 20px;
      color: white;
      position: relative;
      overflow: hidden;
    }
    .hero-area::before {
      content: "";
      position: absolute;
      top: -40%;
      right: -10%;
      width: 300px;
      height: 300px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
    }
    .hero-area::after {
      content: "";
      position: absolute;
      bottom: -30%;
      left: 20%;
      width: 200px;
      height: 200px;
      background: rgba(255,255,255,0.04);
      border-radius: 50%;
    }
    .hero-title {
      font-size: 26px;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }
    .hero-subtitle {
      font-size: 14px;
      opacity: 0.85;
      margin-top: 4px;
      position: relative;
      z-index: 1;
    }
    .hero-class-info {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 16px;
      position: relative;
      z-index: 1;
    }
    .hero-class-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255,255,255,0.18);
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }

    /* === 连接状态 === */
    .ws-status {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-top: 10px;
      position: relative;
      z-index: 1;
    }
    .ws-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .ws-status.connected .ws-status-dot { background: #4ADE80; box-shadow: 0 0 6px rgba(74,222,128,0.5); }
    .ws-status.connecting .ws-status-dot { background: var(--warning); animation: pulse 1s infinite; }
    .ws-status.reconnecting .ws-status-dot { background: #FB923C; animation: pulse 0.8s infinite; }
    .ws-status.failed .ws-status-dot { background: var(--danger); }
    .ws-status.connected { color: rgba(255,255,255,0.9); }
    .ws-status.connecting { color: rgba(255,255,255,0.7); }
    .ws-status.reconnecting { color: rgba(255,255,255,0.7); }
    .ws-status.failed { color: rgba(255,255,255,0.7); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* === 统计卡片 === */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    /* === 侧边栏 === */
    .sidebar-card {
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(var(--glass-blur));
      backdrop-filter: blur(var(--glass-blur));
      border-radius: var(--radius-xl);
      padding: 20px;
      border: var(--glass-border);
      box-shadow: var(--glass-shadow);
      height: fit-content;
      position: sticky;
      top: 84px;
    }
    .sidebar-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .class-select-group {
      margin-bottom: 16px;
    }
    .class-select-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .class-select {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      font-size: 14px;
      cursor: pointer;
      color: var(--text-primary);
    }
    .sidebar-meta {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sidebar-meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .quick-links {
      border-top: 1px solid var(--border);
      padding-top: 16px;
      margin-top: 16px;
    }
    .quick-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius);
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }
    .quick-link:hover {
      background: var(--primary-soft);
      color: var(--primary);
    }

    /* === 主内容 === */
    .main-content {
      min-width: 0;
    }
    .page-header {
      margin-bottom: 20px;
    }

    /* === 搜索框 === */
    .search-bar {
      margin-bottom: 12px;
    }
    .search-bar .search-box {
      max-width: 400px;
    }

    /* === 筛选栏 === */
    .filter-section {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-row-label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      min-width: 42px;
    }
    .filter-btn {
      padding: 7px 14px;
      border-radius: var(--radius-full);
      background: var(--glass-bg-light);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }
    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .filter-sort-row {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .sort-select {
      padding: 7px 12px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--glass-bg-light);
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }
    .sort-select:focus {
      border-color: var(--primary);
      outline: none;
    }
    .results-count {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* === 日期分组头 === */
    .date-group-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 12px;
      padding: 0 4px;
    }
    .date-group-header:first-child {
      margin-top: 0;
    }
    .date-group-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
    }
    .date-group-count {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-hover);
      padding: 2px 10px;
      border-radius: var(--radius-full);
      font-weight: 500;
    }
    .date-group-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* === 作业卡片 === */
    .homework-card {
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 12px;
      border: var(--glass-border);
      border-left: 4px solid var(--primary);
      box-shadow: var(--glass-shadow);
      transition: var(--transition);
      position: relative;
      opacity: 0;
      animation: fadeInUp 0.4s ease forwards;
    }
    .homework-card:nth-child(1) { animation-delay: 0.05s; }
    .homework-card:nth-child(2) { animation-delay: 0.1s; }
    .homework-card:nth-child(3) { animation-delay: 0.15s; }
    .homework-card:nth-child(4) { animation-delay: 0.2s; }
    .homework-card:nth-child(5) { animation-delay: 0.25s; }
    .homework-card:nth-child(6) { animation-delay: 0.3s; }
    .homework-card:nth-child(7) { animation-delay: 0.35s; }
    .homework-card:nth-child(8) { animation-delay: 0.4s; }
    .homework-card:nth-child(9) { animation-delay: 0.45s; }
    .homework-card:nth-child(10) { animation-delay: 0.5s; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .homework-card:hover {
      box-shadow: var(--shadow);
      border-color: var(--border);
    }
    .homework-card.is-new {
      border-left-color: var(--danger);
    }
    .homework-card.is-new::after {
      content: "新";
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, var(--danger), #F87171);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      animation: newBadgePulse 2s ease-in-out infinite;
      box-shadow: 0 2px 6px rgba(232, 70, 58, 0.35);
    }
    @keyframes newBadgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .homework-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .subject-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
    }
    .homework-title {
      font-size: 17px;
      font-weight: 600;
      margin-top: 8px;
      line-height: 1.4;
    }
    .homework-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .homework-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .homework-content {
      font-size: 14px;
      line-height: 1.8;
      color: var(--text-secondary);
      white-space: pre-wrap;
    }
    .homework-content.collapsed {
      max-height: 80px;
      overflow: hidden;
      position: relative;
    }
    .homework-content.collapsed::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(transparent, var(--glass-bg));
    }
    .expand-btn {
      background: none;
      color: var(--primary);
      font-size: 13px;
      padding: 4px 0;
      margin-top: 8px;
      font-weight: 500;
    }

    /* === 附件预览增强 === */
    .attachments-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .attachment-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--bg-hover);
      border-radius: var(--radius);
      font-size: 13px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: var(--transition);
      max-width: 220px;
    }
    .attachment-item:hover {
      background: var(--primary-soft);
      color: var(--primary);
    }
    .attachment-item .att-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .attachment-thumb {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .att-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .att-icon-pdf { background: rgba(232,70,58,0.1); color: var(--danger); }
    .att-icon-doc { background: rgba(34,165,247,0.1); color: var(--info); }
    .att-icon-xls { background: rgba(29,201,129,0.1); color: var(--success); }
    .att-icon-ppt { background: rgba(239,170,23,0.1); color: var(--warning); }
    .att-icon-default { background: var(--bg-hover); color: var(--text-muted); }

    /* === 卡片底部操作栏 === */
    .homework-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: var(--glass-border);
    }
    .hw-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
      transition: var(--transition);
    }
    .hw-action-btn:hover {
      background: var(--primary-soft);
      color: var(--primary);
    }
    .hw-action-btn.bookmarked {
      color: var(--warning);
    }

    /* === 通知 === */
    .notice-banner {
      background: linear-gradient(135deg, var(--warning), #F59E0B);
      color: white;
      padding: 16px 20px;
      border-radius: var(--radius-lg);
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }

    /* === 骨架屏卡片 === */
    .skeleton-hw-card {
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 12px;
      border: var(--glass-border);
    }
    .skeleton-hw-badge {
      width: 64px;
      height: 24px;
      border-radius: var(--radius-full);
    }
    .skeleton-hw-title {
      height: 20px;
      width: 60%;
      margin-top: 10px;
    }
    .skeleton-hw-meta {
      display: flex;
      gap: 16px;
      margin-top: 12px;
    }
    .skeleton-hw-meta-item {
      width: 80px;
      height: 14px;
    }
    .skeleton-hw-content {
      margin-top: 14px;
    }
    .skeleton-hw-content-line {
      height: 14px;
      margin-bottom: 8px;
    }
    .skeleton-hw-content-line:nth-child(1) { width: 100%; }
    .skeleton-hw-content-line:nth-child(2) { width: 90%; }
    .skeleton-hw-content-line:nth-child(3) { width: 75%; }

    /* === 骨架屏过渡 === */
    .skeleton-fade-out {
      animation: skeletonFadeOut 0.35s ease forwards;
    }
    @keyframes skeletonFadeOut {
      to { opacity: 0; transform: scale(0.98); }
    }
    .content-fade-in {
      animation: contentFadeIn 0.4s ease forwards;
    }
    @keyframes contentFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* === 加载更多 === */
    .load-more-sentinel {
      height: 1px;
    }

    /* === 空状态增强 === */
    .empty-state-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.4; }
    .empty-state-text { font-size: 15px; color: var(--text-muted); }
    .empty-state-hint { font-size: 13px; color: var(--text-muted); margin-top: 8px; opacity: 0.7; }

    /* === 全屏作业详情 (移动端) === */
    .hw-detail-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg);
      z-index: 9998;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .hw-detail-overlay.open { display: block; }
    .hw-detail-header {
      position: sticky;
      top: 0;
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(var(--glass-blur));
      backdrop-filter: blur(var(--glass-blur));
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: var(--glass-border);
      z-index: 1;
    }
    .hw-detail-close {
      width: 36px;
      height: 36px;
      border-radius: var(--radius);
      background: var(--bg-hover);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .hw-detail-body {
      padding: 20px;
      max-width: 680px;
      margin: 0 auto;
    }

    /* === 移动端底部筛选栏 === */
    .mobile-filter-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(var(--glass-blur));
      backdrop-filter: blur(var(--glass-blur));
      border-top: var(--glass-border);
      padding: 10px 16px;
      z-index: 100;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
      overflow-x: auto;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .mobile-filter-bar .filter-btn {
      flex-shrink: 0;
    }

    /* === 响应式 === */
    @media (max-width: 768px) {
      .student-layout {
        grid-template-columns: 1fr;
      }
      .sidebar-card {
        position: static;
      }
      .stats-grid {
        grid-template-columns: 1fr;
      }
      .hero-class-info {
        flex-wrap: wrap;
      }
      .mobile-filter-bar {
        display: flex;
      }
      .filter-section {
        display: none;
      }
      .homework-card {
        cursor: pointer;
      }
      .load-more-area {
        padding-bottom: 72px;
      }
    }

    @media (min-width: 769px) {
      .mobile-filter-bar {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="header" id="header"></header>

  <main class="container">
    <div class="student-layout">
      <aside>
        <div class="sidebar-card">
          <div class="sidebar-title">🏫 选择班级</div>
          
          <div class="class-select-group">
            <label>年级</label>
            <select class="class-select" id="gradeSelect" onchange="onGradeChange()">
              <option value="">请选择年级</option>
            </select>
          </div>
          <div class="class-select-group">
            <label>班级</label>
            <select class="class-select" id="classSelect" onchange="onClassChange()">
              <option value="">请选择班级</option>
            </select>
          </div>

          <div class="sidebar-meta" id="sidebarMeta" style="display:none">
            <div class="sidebar-meta-item" id="sidebarStudentCount">👥 <span>--</span> 名学生</div>
            <div class="sidebar-meta-item" id="sidebarLastUpdate">🕐 最近更新: --</div>
          </div>

          <div class="quick-links">
            <a href="/timetable" class="quick-link">
              <span>📅</span> 查看课程表
            </a>
            <a href="/" class="quick-link">
              <span>🏠</span> 返回首页
            </a>
          </div>
        </div>
      </aside>

      <div class="main-content">
        <!-- Hero 区域 -->
        <div class="hero-area" id="heroArea">
          <div class="hero-title" id="heroTitle">作业列表</div>
          <div class="hero-subtitle" id="heroSubtitle">请从左侧选择班级查看作业</div>
          <div class="hero-class-info" id="heroClassInfo" style="display:none">
            <span class="hero-class-tag" id="heroClassTag">🏫 --</span>
            <span class="hero-class-tag" id="heroStudentTag">👥 -- 名学生</span>
          </div>
          <div class="ws-status" id="wsStatus">
            <span class="ws-status-dot"></span>
            <span id="wsStatusText">连接中...</span>
          </div>
        </div>

        <!-- 统计摘要 -->
        <div class="stats-grid" id="statsGrid" style="display:none">
          <div class="stat-card">
            <div class="stat-icon" style="background:rgba(34,165,247,0.1);color:var(--info)">📝</div>
            <div>
              <div class="stat-value" id="statToday">0</div>
              <div class="stat-label">今日作业</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:rgba(239,170,23,0.1);color:var(--warning)">⏳</div>
            <div>
              <div class="stat-value" id="statPending">0</div>
              <div class="stat-label">待完成</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background:rgba(29,201,129,0.1);color:var(--success)">📊</div>
            <div>
              <div class="stat-value" id="statWeek">0</div>
              <div class="stat-label">本周作业</div>
            </div>
          </div>
        </div>

        <div id="noticeContainer"></div>

        <!-- 搜索框 -->
        <div class="search-bar" id="searchBar" style="display:none">
          <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索作业标题或内容...">
          </div>
        </div>

        <!-- 筛选栏 -->
        <div class="filter-section" id="filterSection" style="display:none">
          <div class="filter-row">
            <span class="filter-row-label">时间</span>
            <button class="filter-btn active" data-date="all" onclick="setDateFilter('all')">全部</button>
            <button class="filter-btn" data-date="today" onclick="setDateFilter('today')">今天</button>
            <button class="filter-btn" data-date="week" onclick="setDateFilter('week')">本周</button>
            <button class="filter-btn" data-date="month" onclick="setDateFilter('month')">本月</button>
          </div>
          <div class="filter-row" id="subjectFilterRow">
            <span class="filter-row-label">科目</span>
            <button class="filter-btn active" data-filter="all" onclick="setSubjectFilter('all')">全部科目</button>
          </div>
          <div class="filter-sort-row">
            <span class="results-count" id="resultsCount"></span>
            <select class="sort-select" id="sortSelect" onchange="setSort(this.value)">
              <option value="newest">按时间最新</option>
              <option value="subject">按科目</option>
              <option value="due">按截止日期</option>
            </select>
          </div>
        </div>

        <!-- 作业列表 -->
        <div id="homeworkList">
          <div class="empty-state">
            <div class="empty-state-icon">📖</div>
            <div class="empty-state-text">请选择年级和班级查看作业</div>
            <div class="empty-state-hint">从左侧下拉菜单选择年级和班级</div>
          </div>
        </div>

        <div class="load-more-area" id="loadMoreArea" style="display:none">
          <div class="load-more" id="loadMoreContainer"></div>
          <div class="load-more-sentinel" id="loadMoreSentinel"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- 移动端底部筛选栏 -->
  <div class="mobile-filter-bar" id="mobileFilterBar"></div>

  <!-- 移动端全屏详情 -->
  <div class="hw-detail-overlay" id="hwDetailOverlay">
    <div class="hw-detail-header">
      <button class="hw-detail-close" onclick="closeDetail()">✕</button>
      <div style="font-weight:600;font-size:16px" id="detailTitle">作业详情</div>
    </div>
    <div class="hw-detail-body" id="detailBody"></div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    // ============================================================
    // 状态
    // ============================================================
    let gradesData = [];
    let currentGradeId = null;
    let currentClassId = null;
    let currentClassName = '';
    let currentSubjectFilter = 'all';
    let currentDateFilter = 'all';
    let currentSort = 'newest';
    let searchKeyword = '';
    let ws = null;
    let allHomework = [];
    let allNotices = [];
    let displayedCount = 0;
    const PAGE_SIZE = 20;
    let lastViewTime = Storage.get('hw_last_view_time', 0);
    let bookmarks = Storage.get('hw_bookmarks', []);
    let ioObserver = null;

    // ============================================================
    // 初始化
    // ============================================================
    async function init() {
      initHeader('student');
      recordVisit('/student');
      await loadGrades();
      
      const urlParams = new URLSearchParams(window.location.search);
      const gradeId = urlParams.get('gradeId');
      const classId = urlParams.get('classId');
      
      if (gradeId && classId) {
        const grade = gradesData.find(g => String(g.id) === String(gradeId));
        const cls = grade?.classes?.find(c => String(c.id) === String(classId));
        await selectClass(gradeId, classId, cls?.name || '');
      } else if (API.user?.classId) {
        await selectClass(String(API.user.gradeId), String(API.user.classId), API.user.className || '');
      }

      // 搜索防抖
      document.getElementById('searchInput').addEventListener('input', debounce(function() {
        searchKeyword = this.value.trim();
        resetDisplayAndRender();
      }, 300));

      // IntersectionObserver 无限滚动
      setupInfiniteScroll();
    }

    async function loadGrades() {
      try {
        const data = await API.get('/api/grades/classes/all');
        gradesData = data.data || [];
        
        const gradeSelect = document.getElementById('gradeSelect');
        gradesData.forEach(g => {
          const opt = document.createElement('option');
          opt.value = g.id;
          opt.textContent = g.name;
          gradeSelect.appendChild(opt);
        });
      } catch (e) {
        showToast('加载年级失败', 'error');
      }
    }

    function onGradeChange() {
      const gradeId = document.getElementById('gradeSelect').value;
      const classSelect = document.getElementById('classSelect');
      classSelect.innerHTML = '<option value="">请选择班级</option>';
      currentGradeId = gradeId;
      
      if (gradeId) {
        const grade = gradesData.find(g => String(g.id) === String(gradeId));
        if (grade?.classes) {
          [...grade.classes].sort((a,b) => a.class_num - b.class_num).forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.name;
            classSelect.appendChild(opt);
          });
        }
      }
    }

    function onClassChange() {
      const classId = document.getElementById('classSelect').value;
      if (classId && currentGradeId) {
        const grade = gradesData.find(g => String(g.id) === String(currentGradeId));
        const cls = grade?.classes?.find(c => String(c.id) === String(classId));
        selectClass(String(currentGradeId), String(classId), cls?.name || '');
      }
    }

    async function selectClass(gradeId, classId, className) {
      currentGradeId = String(gradeId);
      currentClassId = String(classId);
      currentClassName = className || '';
      
      const gradeSelect = document.getElementById('gradeSelect');
      const classSelect = document.getElementById('classSelect');
      
      gradeSelect.value = currentGradeId;
      
      classSelect.innerHTML = '<option value="">请选择班级</option>';
      const grade = gradesData.find(g => String(g.id) === String(currentGradeId));
      if (grade?.classes) {
        [...grade.classes].sort((a, b) => a.class_num - b.class_num).forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.name;
          classSelect.appendChild(opt);
        });
      }
      classSelect.value = currentClassId;
      
      // 更新 hero 区域
      document.getElementById('heroTitle').textContent = currentClassName || '作业列表';
      document.getElementById('heroSubtitle').textContent = '每日作业与公告';
      
      // 显示筛选/搜索
      document.getElementById('filterSection').style.display = 'flex';
      document.getElementById('searchBar').style.display = 'block';
      document.getElementById('wsStatus').style.display = 'inline-flex';
      setWsStatus('connecting');

      // 加载数据 - 先显示骨架屏
      showHomeworkSkeleton();
      await loadHomeworkAndNotices();
      connectWS();
      
      const newUrl = new URL(window.location);
      newUrl.searchParams.set('gradeId', currentGradeId);
      newUrl.searchParams.set('classId', currentClassId);
      newUrl.searchParams.delete('className');
      window.history.replaceState({}, '', newUrl);
    }

    // ============================================================
    // 骨架屏
    // ============================================================
    function showHomeworkSkeleton() {
      const container = document.getElementById('homeworkList');
      let html = '';
      for (let i = 0; i < 4; i++) {
        html += `
          <div class="skeleton-hw-card">
            <div class="skeleton skeleton-hw-badge"></div>
            <div class="skeleton skeleton-hw-title"></div>
            <div class="skeleton-hw-meta">
              <div class="skeleton skeleton-hw-meta-item"></div>
              <div class="skeleton skeleton-hw-meta-item"></div>
              <div class="skeleton skeleton-hw-meta-item"></div>
            </div>
            <div class="skeleton-hw-content">
              <div class="skeleton skeleton-hw-content-line"></div>
              <div class="skeleton skeleton-hw-content-line"></div>
              <div class="skeleton skeleton-hw-content-line"></div>
            </div>
          </div>`;
      }
      container.innerHTML = html;
    }

    // ============================================================
    // 数据加载
    // ============================================================
    async function loadHomeworkAndNotices() {
      if (!currentClassId) return;
      
      try {
        const [homeworkRes, noticesRes] = await Promise.all([
          API.get(`/api/homework?class_id=${currentClassId}&pageSize=100`),
          API.get(`/api/notices?class_id=${currentClassId}&pageSize=20`)
        ]);
        
        allHomework = homeworkRes.data?.list || homeworkRes.data?.homework || [];
        allNotices = noticesRes.data?.list || noticesRes.data?.notices || [];
        
        // 更新最后查看时间
        lastViewTime = Date.now();
        Storage.set('hw_last_view_time', lastViewTime);
        
        // 骨架屏平滑过渡
        const container = document.getElementById('homeworkList');
        const skeletons = container.querySelectorAll('.skeleton-hw-card');
        if (skeletons.length > 0) {
          skeletons.forEach(s => s.classList.add('skeleton-fade-out'));
          await new Promise(r => setTimeout(r, 350));
        }

        updateSidebarMeta();
        updateHeroClassInfo();
        updateStats();
        renderNotices();
        renderSubjectFilters();
        resetDisplayAndRender();
      } catch (e) {
        showToast('加载失败', 'error');
        document.getElementById('homeworkList').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">❌</div>
            <div class="empty-state-text">加载失败，请刷新重试</div>
          </div>`;
      }
    }

    // ============================================================
    // 侧边栏增强
    // ============================================================
    function updateSidebarMeta() {
      const meta = document.getElementById('sidebarMeta');
      if (!currentClassId) { meta.style.display = 'none'; return; }
      meta.style.display = 'flex';

      const grade = gradesData.find(g => String(g.id) === String(currentGradeId));
      const cls = grade?.classes?.find(c => String(c.id) === String(currentClassId));
      const studentCount = cls?.student_count ?? cls?.studentCount ?? '--';
      document.getElementById('sidebarStudentCount').querySelector('span').textContent = studentCount;

      // 最近更新时间
      const latestHw = allHomework.length > 0 ? allHomework[0] : null;
      const latestTime = latestHw ? formatRelativeTime(latestHw.created_at) : '--';
      document.getElementById('sidebarLastUpdate').textContent = '🕐 最近更新: ' + latestTime;
    }

    // ============================================================
    // Hero 增强
    // ============================================================
    function updateHeroClassInfo() {
      const info = document.getElementById('heroClassInfo');
      if (!currentClassId) { info.style.display = 'none'; return; }
      info.style.display = 'flex';
      document.getElementById('heroClassTag').textContent = '🏫 ' + escapeHtml(currentClassName);

      const grade = gradesData.find(g => String(g.id) === String(currentGradeId));
      const cls = grade?.classes?.find(c => String(c.id) === String(currentClassId));
      const studentCount = cls?.student_count ?? cls?.studentCount ?? '--';
      document.getElementById('heroStudentTag').textContent = '👥 ' + studentCount + ' 名学生';
    }

    // ============================================================
    // 统计摘要
    // ============================================================
    function updateStats() {
      const grid = document.getElementById('statsGrid');
      if (!currentClassId || allHomework.length === 0) {
        grid.style.display = 'none';
        return;
      }
      grid.style.display = 'grid';

      const now = new Date();
      const todayStr = now.toISOString().slice(0, 10);
      const dayOfWeek = now.getDay() || 7;
      const weekStart = new Date(now);
      weekStart.setDate(now.getDate() - dayOfWeek + 1);
      weekStart.setHours(0, 0, 0, 0);

      let todayCount = 0, pendingCount = 0, weekCount = 0;
      allHomework.forEach(h => {
        const created = h.created_at ? new Date(h.created_at) : null;
        if (!created) return;
        const createdStr = created.toISOString().slice(0, 10);
        if (createdStr === todayStr) todayCount++;
        if (created >= weekStart) weekCount++;
        if (h.due_date) {
          const due = new Date(h.due_date);
          if (due >= now) pendingCount++;
        }
      });

      document.getElementById('statToday').textContent = todayCount;
      document.getElementById('statPending').textContent = pendingCount;
      document.getElementById('statWeek').textContent = weekCount;
    }

    // ============================================================
    // 筛选和排序
    // ============================================================
    function renderSubjectFilters() {
      const subjects = [...new Set(allHomework.map(h => h.subjectName).filter(Boolean))];
      const bar = document.getElementById('subjectFilterRow');
      bar.innerHTML = `<span class="filter-row-label">科目</span>`;
      
      const allBtn = document.createElement('button');
      allBtn.className = 'filter-btn' + (currentSubjectFilter === 'all' ? ' active' : '');
      allBtn.textContent = '全部科目';
      allBtn.onclick = () => setSubjectFilter('all');
      bar.appendChild(allBtn);

      subjects.forEach(s => {
        const color = getSubjectColor(s);
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (currentSubjectFilter === s ? ' active' : '');
        btn.textContent = s;
        if (currentSubjectFilter === s) {
          btn.style.background = color;
          btn.style.borderColor = color;
        }
        btn.onclick = () => setSubjectFilter(s);
        bar.appendChild(btn);
      });

      // 同步移动端筛选栏
      renderMobileFilterBar(subjects);
    }

    function renderMobileFilterBar(subjects) {
      const bar = document.getElementById('mobileFilterBar');
      bar.innerHTML = '';
      
      const allBtn = document.createElement('button');
      allBtn.className = 'filter-btn' + (currentSubjectFilter === 'all' ? ' active' : '');
      allBtn.textContent = '全部';
      allBtn.onclick = () => setSubjectFilter('all');
      bar.appendChild(allBtn);

      subjects.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (currentSubjectFilter === s ? ' active' : '');
        btn.textContent = s;
        btn.onclick = () => setSubjectFilter(s);
        bar.appendChild(btn);
      });
    }

    function setSubjectFilter(filter) {
      currentSubjectFilter = filter;
      renderSubjectFilters();
      resetDisplayAndRender();
    }

    function setDateFilter(filter) {
      currentDateFilter = filter;
      document.querySelectorAll('[data-date]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.date === filter);
      });
      resetDisplayAndRender();
    }

    function setSort(sort) {
      currentSort = sort;
      resetDisplayAndRender();
    }

    function getFilteredSortedHomework() {
      let list = [...allHomework];
      const now = new Date();
      const todayStr = now.toISOString().slice(0, 10);
      const dayOfWeek = now.getDay() || 7;
      const weekStart = new Date(now);
      weekStart.setDate(now.getDate() - dayOfWeek + 1);
      weekStart.setHours(0, 0, 0, 0);
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

      // 日期筛选
      if (currentDateFilter === 'today') {
        list = list.filter(h => h.created_at && h.created_at.slice(0, 10) === todayStr);
      } else if (currentDateFilter === 'week') {
        list = list.filter(h => h.created_at && new Date(h.created_at) >= weekStart);
      } else if (currentDateFilter === 'month') {
        list = list.filter(h => h.created_at && new Date(h.created_at) >= monthStart);
      }

      // 科目筛选
      if (currentSubjectFilter !== 'all') {
        list = list.filter(h => h.subjectName === currentSubjectFilter);
      }

      // 搜索
      if (searchKeyword) {
        const kw = searchKeyword.toLowerCase();
        list = list.filter(h => {
          const title = (h.title || '').toLowerCase();
          const content = (h.content || '').toLowerCase();
          return title.includes(kw) || content.includes(kw);
        });
      }

      // 排序
      if (currentSort === 'newest') {
        list.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      } else if (currentSort === 'subject') {
        list.sort((a, b) => (a.subjectName || '').localeCompare(b.subjectName || ''));
      } else if (currentSort === 'due') {
        list.sort((a, b) => {
          if (!a.due_date && !b.due_date) return 0;
          if (!a.due_date) return 1;
          if (!b.due_date) return -1;
          return new Date(a.due_date) - new Date(b.due_date);
        });
      }

      return list;
    }

    // ============================================================
    // 渲染作业列表 (时间线分组)
    // ============================================================
    function resetDisplayAndRender() {
      displayedCount = 0;
      renderHomework();
    }

    function renderHomework() {
      const container = document.getElementById('homeworkList');
      const filtered = getFilteredSortedHomework();
      
      // 更新结果计数
      document.getElementById('resultsCount').textContent = `共 ${filtered.length} 条作业`;

      // 空状态
      if (!currentClassId) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📖</div>
            <div class="empty-state-text">请选择年级和班级查看作业</div>
            <div class="empty-state-hint">从左侧下拉菜单选择年级和班级</div>
          </div>`;
        document.getElementById('loadMoreArea').style.display = 'none';
        return;
      }
      if (filtered.length === 0) {
        let icon = '📭', text = '暂无作业', hint = '';
        if (searchKeyword) {
          icon = '🔍';
          text = '搜索无结果';
          hint = `未找到包含"${escapeHtml(searchKeyword)}"的作业`;
        } else if (currentSubjectFilter !== 'all') {
          icon = '📚';
          text = `暂无${escapeHtml(currentSubjectFilter)}作业`;
          hint = '尝试切换其他科目或清除筛选';
        } else if (currentDateFilter !== 'all') {
          icon = '📅';
          text = '该时段暂无作业';
          hint = '尝试扩大时间范围';
        }
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">${icon}</div>
            <div class="empty-state-text">${text}</div>
            ${hint ? `<div class="empty-state-hint">${hint}</div>` : ''}
          </div>`;
        document.getElementById('loadMoreArea').style.display = 'none';
        return;
      }

      // 按日期分组
      const groups = groupByDate(filtered);
      
      // 只渲染到 displayedCount
      let html = '';
      let count = 0;
      let reachedLimit = false;

      for (const group of groups) {
        if (count >= displayedCount + PAGE_SIZE) { reachedLimit = true; break; }
        
        let groupHtml = '';
        let groupCardCount = 0;

        for (const h of group.items) {
          if (count >= displayedCount + PAGE_SIZE) { reachedLimit = true; break; }
          if (count < displayedCount) { count++; continue; }

          groupCardCount++;
          count++;
          groupHtml += renderHomeworkCard(h);
        }

        if (groupCardCount > 0) {
          html += `
            <div class="date-group-header">
              <span class="date-group-label">${escapeHtml(group.label)}</span>
              <span class="date-group-count">${groupCardCount} 条</span>
              <div class="date-group-line"></div>
            </div>`;
          html += groupHtml;
        }
      }

      displayedCount = count;

      if (displayedCount === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <div class="empty-state-text">暂无作业</div>
          </div>`;
        document.getElementById('loadMoreArea').style.display = 'none';
        return;
      }

      container.innerHTML = html;
      container.classList.add('content-fade-in');

      // 展开按钮
      setTimeout(() => {
        container.querySelectorAll('.homework-content').forEach(el => {
          const id = el.id.replace('content-', '');
          const btn = document.getElementById('expand-' + id);
          if (el.scrollHeight <= 90) {
            el.classList.remove('collapsed');
            if (btn) btn.style.display = 'none';
          } else {
            if (btn) btn.style.display = 'block';
          }
        });
      }, 50);

      // 加载更多
      const loadMoreArea = document.getElementById('loadMoreArea');
      const loadMoreContainer = document.getElementById('loadMoreContainer');
      if (displayedCount < filtered.length) {
        loadMoreArea.style.display = 'block';
        loadMoreContainer.innerHTML = `
          <button class="load-more-btn" onclick="loadMore()">
            加载更多 (还有 ${filtered.length - displayedCount} 条)
          </button>`;
      } else {
        loadMoreArea.style.display = 'block';
        loadMoreContainer.innerHTML = `<div class="load-more-end">已加载全部 ${filtered.length} 条作业</div>`;
      }
    }

    function renderHomeworkCard(h) {
      const subjectColor = getSubjectColor(h.subjectName);
      const attachments = h.attachments || [];
      const isNew = h.created_at && (Date.now() - new Date(h.created_at).getTime()) < 24 * 3600 * 1000
                    && new Date(h.created_at).getTime() > lastViewTime;
      const isBookmarked = bookmarks.includes(h.id);
      
      let titleHtml = escapeHtml(h.title || '');
      let contentHtml = escapeHtml(h.content || '');
      if (searchKeyword) {
        titleHtml = highlightText(h.title || '', searchKeyword);
        contentHtml = highlightText(h.content || '', searchKeyword);
      }

      const attachmentsHtml = attachments.length > 0 ? `
        <div class="attachments-list">
          ${attachments.map(a => renderAttachment(a)).join('')}
        </div>` : '';

      return `
        <div class="homework-card${isNew ? ' is-new' : ''}" style="border-left-color:${subjectColor}" ${isMobile() ? `onclick="openDetail('${h.id}')"` : ''}>
          <div class="homework-header">
            <div>
              <span class="subject-badge" style="background:${subjectColor}20;color:${subjectColor}">${escapeHtml(h.subjectName || '其他')}</span>
              <div class="homework-title">${titleHtml}</div>
            </div>
          </div>
          <div class="homework-meta">
            <span class="homework-meta-item">👨‍🏫 ${escapeHtml(h.teacherName || '未知教师')}</span>
            <span class="homework-meta-item">🕐 ${escapeHtml(formatDateTime(h.created_at))}</span>
            ${h.due_date ? `<span class="homework-meta-item">📅 截止: ${escapeHtml(h.due_date)}</span>` : ''}
          </div>
          <div class="homework-content collapsed" id="content-${h.id}">${contentHtml}</div>
          <button class="expand-btn" onclick="event.stopPropagation();toggleExpand('${h.id}')" id="expand-${h.id}">展开全文 ▼</button>
          ${attachmentsHtml}
          <div class="homework-actions">
            <button class="hw-action-btn${isBookmarked ? ' bookmarked' : ''}" onclick="event.stopPropagation();toggleBookmark(${h.id}, this)">
              ${isBookmarked ? '★' : '☆'} 收藏
            </button>
            <button class="hw-action-btn" onclick="event.stopPropagation();shareHomework(${h.id})">
              ↗ 分享
            </button>
            ${isMobile() ? '' : `<button class="hw-action-btn" onclick="event.stopPropagation();openDetail('${h.id}')">📋 详情</button>`}
          </div>
        </div>`;
    }

    function renderAttachment(a) {
      const url = a.url || a;
      const name = a.filename || a.name || '附件';
      const ext = name.split('.').pop().toLowerCase();
      const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp'].includes(ext);
      const isPdf = ext === 'pdf';
      const isDoc = ['doc', 'docx'].includes(ext);
      const isXls = ['xls', 'xlsx', 'csv'].includes(ext);
      const isPpt = ['ppt', 'pptx'].includes(ext);

      if (isImage && url) {
        return `<a href="${escapeHtml(url)}" target="_blank" class="attachment-item">
          <img src="${escapeHtml(url)}" class="attachment-thumb" alt="${escapeHtml(name)}" onerror="this.style.display='none'">
          <span class="att-name">${escapeHtml(name)}</span>
        </a>`;
      }

      let iconClass = 'att-icon-default', icon = '📎';
      if (isPdf) { iconClass = 'att-icon-pdf'; icon = '📄'; }
      else if (isDoc) { iconClass = 'att-icon-doc'; icon = '📝'; }
      else if (isXls) { iconClass = 'att-icon-xls'; icon = '📊'; }
      else if (isPpt) { iconClass = 'att-icon-ppt'; icon = '📽'; }

      return `<a href="${escapeHtml(url)}" target="_blank" class="attachment-item">
        <span class="att-icon ${iconClass}">${icon}</span>
        <span class="att-name">${escapeHtml(name)}</span>
      </a>`;
    }

    // ============================================================
    // 日期分组
    // ============================================================
    function groupByDate(items) {
      const now = new Date();
      const todayStr = now.toISOString().slice(0, 10);
      const yesterday = new Date(now);
      yesterday.setDate(now.getDate() - 1);
      const yesterdayStr = yesterday.toISOString().slice(0, 10);

      const groups = [];
      const groupMap = {};

      items.forEach(h => {
        const dateStr = h.created_at ? h.created_at.slice(0, 10) : 'unknown';
        let label;
        if (dateStr === todayStr) {
          label = '今天 ' + formatDateShort(now);
        } else if (dateStr === yesterdayStr) {
          label = '昨天 ' + formatDateShort(yesterday);
        } else if (dateStr === 'unknown') {
          label = '未知日期';
        } else {
          const d = new Date(dateStr);
          const days = ['日', '一', '二', '三', '四', '五', '六'];
          label = formatDateShort(d) + ' 星期' + days[d.getDay()];
        }

        if (!groupMap[dateStr]) {
          groupMap[dateStr] = { label, items: [] };
          groups.push(groupMap[dateStr]);
        }
        groupMap[dateStr].items.push(h);
      });

      return groups;
    }

    function formatDateShort(d) {
      return (d.getMonth() + 1) + '月' + d.getDate() + '日';
    }

    // ============================================================
    // 无限滚动
    // ============================================================
    function setupInfiniteScroll() {
      const sentinel = document.getElementById('loadMoreSentinel');
      if (!sentinel) return;
      
      ioObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
          const filtered = getFilteredSortedHomework();
          if (displayedCount < filtered.length) {
            loadMore();
          }
        }
      }, { rootMargin: '200px' });
      ioObserver.observe(sentinel);
    }

    function loadMore() {
      const filtered = getFilteredSortedHomework();
      if (displayedCount >= filtered.length) return;

      const container = document.getElementById('homeworkList');
      const loadMoreContainer = document.getElementById('loadMoreContainer');
      loadMoreContainer.innerHTML = '<div class="load-more-spinner"></div>';

      setTimeout(() => {
        // 获取下一批
        const groups = groupByDate(filtered);
        let html = '';
        let count = 0;
        let newCards = 0;

        for (const group of groups) {
          if (newCards >= PAGE_SIZE) break;
          let groupHtml = '';
          let groupCardCount = 0;

          for (const h of group.items) {
            if (count < displayedCount) { count++; continue; }
            if (newCards >= PAGE_SIZE) break;
            count++;
            newCards++;
            groupCardCount++;
            groupHtml += renderHomeworkCard(h);
          }

          if (groupCardCount > 0) {
            html += `
              <div class="date-group-header">
                <span class="date-group-label">${escapeHtml(group.label)}</span>
                <span class="date-group-count">${groupCardCount} 条</span>
                <div class="date-group-line"></div>
              </div>`;
            html += groupHtml;
          }
        }

        displayedCount = count;
        container.insertAdjacentHTML('beforeend', html);

        // 新卡片展开检查
        setTimeout(() => {
          container.querySelectorAll('.homework-content.collapsed').forEach(el => {
            const id = el.id.replace('content-', '');
            const btn = document.getElementById('expand-' + id);
            if (el.scrollHeight <= 90) {
              el.classList.remove('collapsed');
              if (btn) btn.style.display = 'none';
            }
          });
        }, 50);

        if (displayedCount < filtered.length) {
          loadMoreContainer.innerHTML = `
            <button class="load-more-btn" onclick="loadMore()">
              加载更多 (还有 ${filtered.length - displayedCount} 条)
            </button>`;
        } else {
          loadMoreContainer.innerHTML = `<div class="load-more-end">已加载全部 ${filtered.length} 条作业</div>`;
        }
      }, 300);
    }

    // ============================================================
    // 展开/收起
    // ============================================================
    function toggleExpand(id) {
      const content = document.getElementById(`content-${id}`);
      const btn = document.getElementById(`expand-${id}`);
      if (!content || !btn) return;
      if (content.classList.contains('collapsed')) {
        content.classList.remove('collapsed');
        btn.textContent = '收起 ▲';
      } else {
        content.classList.add('collapsed');
        btn.textContent = '展开全文 ▼';
      }
    }

    // ============================================================
    // 收藏
    // ============================================================
    function toggleBookmark(id, btn) {
      const idx = bookmarks.indexOf(id);
      if (idx >= 0) {
        bookmarks.splice(idx, 1);
        btn.classList.remove('bookmarked');
        btn.innerHTML = '☆ 收藏';
      } else {
        bookmarks.push(id);
        btn.classList.add('bookmarked');
        btn.innerHTML = '★ 收藏';
      }
      Storage.set('hw_bookmarks', bookmarks);
    }

    // ============================================================
    // 分享
    // ============================================================
    function shareHomework(id) {
      const hw = allHomework.find(h => String(h.id) === String(id));
      if (!hw) return;
      const url = window.location.origin + window.location.pathname + '?gradeId=' + currentGradeId + '&classId=' + currentClassId;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => {
          showToast('链接已复制到剪贴板', 'success');
        }).catch(() => {
          showToast('分享链接: ' + url, 'info');
        });
      } else {
        showToast('分享链接: ' + url, 'info');
      }
    }

    // ============================================================
    // 通知
    // ============================================================
    function renderNotices() {
      const container = document.getElementById('noticeContainer');
      const importantNotices = allNotices.filter(n => n.is_important);
      
      if (importantNotices.length === 0) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = importantNotices.map(n => `
        <div class="notice-banner">
          <div style="font-size:20px;flex-shrink:0">📢</div>
          <div style="flex:1">
            <div style="font-weight:600;margin-bottom:4px">${escapeHtml(n.title)}</div>
            <div style="font-size:13px;opacity:0.9">${escapeHtml(n.content)}</div>
          </div>
        </div>
      `).join('');
    }

    // ============================================================
    // WebSocket 连接状态
    // ============================================================
    function setWsStatus(status) {
      const el = document.getElementById('wsStatus');
      const textEl = document.getElementById('wsStatusText');
      el.className = 'ws-status ' + status;
      const labels = {
        connected: '实时连接中',
        connecting: '连接中...',
        reconnecting: '断线重连中...',
        failed: '连接失败'
      };
      textEl.textContent = labels[status] || status;
    }

    function connectWS() {
      if (ws && ws._destroy) ws._destroy();
      setWsStatus('connecting');

      ws = connectWebSocket(currentGradeId, currentClassId, (data) => {
        if (data.type === 'homework_created' || data.type === 'homework_updated') {
          showToast('📝 作业已更新', 'success');
          setWsStatus('connected');
          loadHomeworkAndNotices();
        } else if (data.type === 'notice_created') {
          showToast('📢 有新公告', 'info');
          setWsStatus('connected');
          loadHomeworkAndNotices();
        }
      });

      // 监听状态变化
      const origOnOpen = ws.onopen;
      ws.onopen = function(e) {
        setWsStatus('connected');
        if (origOnOpen) origOnOpen.call(this, e);
      };
      const origOnClose = ws.onclose;
      ws.onclose = function(e) {
        if (!ws._intentionalClose) setWsStatus('reconnecting');
        if (origOnClose) origOnClose.call(this, e);
      };
      const origOnError = ws.onerror;
      ws.onerror = function(e) {
        setWsStatus('failed');
        if (origOnError) origOnError.call(this, e);
      };
    }

    // ============================================================
    // 移动端全屏详情
    // ============================================================
    function isMobile() {
      return window.innerWidth <= 768;
    }

    function openDetail(id) {
      if (!isMobile()) return;
      const hw = allHomework.find(h => String(h.id) === String(id));
      if (!hw) return;

      const subjectColor = getSubjectColor(hw.subjectName);
      const attachments = hw.attachments || [];
      const body = document.getElementById('detailBody');
      document.getElementById('detailTitle').textContent = hw.title || '作业详情';

      body.innerHTML = `
        <div style="margin-bottom:16px">
          <span class="subject-badge" style="background:${subjectColor}20;color:${subjectColor}">${escapeHtml(hw.subjectName || '其他')}</span>
        </div>
        <h2 style="font-size:20px;font-weight:700;margin-bottom:12px">${escapeHtml(hw.title || '')}</h2>
        <div class="homework-meta" style="margin-bottom:16px">
          <span class="homework-meta-item">👨‍🏫 ${escapeHtml(hw.teacherName || '未知教师')}</span>
          <span class="homework-meta-item">🕐 ${escapeHtml(formatDateTime(hw.created_at))}</span>
          ${hw.due_date ? `<span class="homework-meta-item">📅 截止: ${escapeHtml(hw.due_date)}</span>` : ''}
        </div>
        <div style="font-size:15px;line-height:1.9;color:var(--text-secondary);white-space:pre-wrap">${escapeHtml(hw.content || '')}</div>
        ${attachments.length > 0 ? `
          <div style="margin-top:20px">
            <div style="font-size:14px;font-weight:600;margin-bottom:10px">📎 附件</div>
            <div class="attachments-list">${attachments.map(a => renderAttachment(a)).join('')}</div>
          </div>` : ''}
      `;

      document.getElementById('hwDetailOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeDetail() {
      document.getElementById('hwDetailOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    // ============================================================
    // 工具
    // ============================================================
    function formatRelativeTime(date) {
      if (!date) return '--';
      const d = new Date(date);
      const diff = Date.now() - d.getTime();
      const min = Math.floor(diff / 60000);
      if (min < 1) return '刚刚';
      if (min < 60) return min + '分钟前';
      const hr = Math.floor(min / 60);
      if (hr < 24) return hr + '小时前';
      const day = Math.floor(hr / 24);
      if (day < 7) return day + '天前';
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
