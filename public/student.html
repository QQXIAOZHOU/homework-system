<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生端 - 作业公布站</title>
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .student-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
      padding: 24px 0;
    }

    .sidebar {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      height: fit-content;
      position: sticky;
      top: 88px;
      border: 1px solid var(--border-light);
    }

    .sidebar-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .grade-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .grade-item {
      padding: 10px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: var(--transition);
    }

    .grade-item:hover {
      background: var(--bg-hover);
    }

    .grade-item.active {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .class-list {
      margin-top: 8px;
      margin-left: 12px;
      padding-left: 12px;
      border-left: 2px solid var(--border);
    }

    .class-item {
      padding: 8px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      color: var(--text-secondary);
      transition: var(--transition);
    }

    .class-item:hover {
      color: var(--primary);
      background: var(--bg-hover);
    }

    .class-item.active {
      color: var(--primary);
      font-weight: 500;
    }

    .main-content {
      min-width: 0;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
    }

    .page-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .notice-banner {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 16px 20px;
      border-radius: var(--radius-lg);
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .notice-icon {
      font-size: 24px;
      flex-shrink: 0;
    }

    .notice-content {
      flex: 1;
    }

    .notice-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .notice-text {
      font-size: 14px;
      opacity: 0.9;
      line-height: 1.6;
    }

    .notice-close {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .homework-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .homework-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--border-light);
      transition: var(--transition);
    }

    .homework-card:hover {
      box-shadow: var(--shadow);
      border-color: var(--border);
    }

    .homework-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 12px;
    }

    .homework-subject {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .subject-dot {
      width: 10px;
      height: 10px;
      border-radius: var(--radius-full);
    }

    .homework-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .homework-meta {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .homework-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .homework-content {
      font-size: 14px;
      line-height: 1.8;
      color: var(--text-secondary);
      margin: 12px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .homework-content.collapsed {
      max-height: 80px;
      overflow: hidden;
      position: relative;
    }

    .homework-content.collapsed::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(transparent, var(--bg-card));
    }

    .expand-btn {
      color: var(--primary);
      font-size: 13px;
      cursor: pointer;
      background: none;
      padding: 4px 0;
      font-weight: 500;
    }

    .homework-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .link-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--bg-hover);
      border-radius: var(--radius);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .link-item:hover {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .attachments-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .attachment-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: var(--radius);
      font-size: 13px;
    }

    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--success);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @media (max-width: 768px) {
      .student-layout {
        grid-template-columns: 1fr;
      }
      
      .sidebar {
        position: static;
      }
      
      .class-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-left: 0;
        padding-left: 0;
        border-left: none;
        margin-top: 12px;
      }
      
      .class-item {
        padding: 6px 12px;
        background: var(--bg-hover);
        border-radius: var(--radius-full);
      }
      
      .grade-list {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 8px;
      }
      
      .grade-item {
        padding: 8px 14px;
        background: var(--bg-hover);
        border-radius: var(--radius-full);
      }
    }
  </style>
</head>
<body>
  <header class="header" id="header"></header>

  <main class="container">
    <div class="student-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-title">📚 年级班级</div>
        <div class="grade-list" id="gradeList">
          <div class="loading"><div class="spinner"></div>加载中...</div>
        </div>
      </aside>

      <div class="main-content">
        <div class="page-header">
          <div>
            <h1 class="page-title" id="pageTitle">作业列表</h1>
            <p class="page-subtitle" id="pageSubtitle">选择班级查看作业</p>
          </div>
          <div class="live-indicator" id="liveIndicator" style="display:none">
            <span class="live-dot"></span>
            实时同步中
          </div>
        </div>

        <div id="noticeContainer"></div>

        <div class="filter-bar" id="filterBar" style="display:none">
          <button class="filter-btn active" data-filter="all">全部科目</button>
        </div>

        <div class="homework-list" id="homeworkList">
          <div class="empty-state">
            <div class="empty-icon">📖</div>
            <div class="empty-text">请从左侧选择年级和班级</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    let gradesData = [];
    let currentGradeId = null;
    let currentClassId = null;
    let currentFilter = 'all';
    let ws = null;
    let allHomework = [];
    let allNotices = [];

    async function init() {
      initHeader('student');
      await loadGrades();
      
      const urlParams = new URLSearchParams(window.location.search);
      const gradeId = urlParams.get('gradeId');
      const classId = urlParams.get('classId');
      
      if (gradeId && classId) {
        selectClass(parseInt(gradeId), classId);
      } else if (API.user && API.user.gradeId && API.user.classId) {
        selectClass(API.user.gradeId, API.user.classId);
      }

      recordVisit('/student');
    }

    async function loadGrades() {
      try {
        const data = await API.get('/api/grades');
        gradesData = data.data;
        renderGradeList();
      } catch (e) {
        document.getElementById('gradeList').innerHTML = '<div class="text-muted">加载失败</div>';
      }
    }

    function renderGradeList() {
      const container = document.getElementById('gradeList');
      container.innerHTML = gradesData.map(grade => `
        <div>
          <div class="grade-item ${currentGradeId === grade.id ? 'active' : ''}" onclick="toggleGrade(${grade.id})">
            ${grade.fullName}
          </div>
          <div class="class-list" id="classList-${grade.id}" style="${currentGradeId === grade.id ? '' : 'display:none'}">
            ${grade.classes.map(cls => `
              <div class="class-item ${currentClassId === cls.id ? 'active' : ''}" onclick="event.stopPropagation();selectClass(${grade.id}, '${cls.id}')">
                ${cls.class_name}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function toggleGrade(gradeId) {
      const classList = document.getElementById(`classList-${gradeId}`);
      if (classList) {
        classList.style.display = classList.style.display === 'none' ? 'block' : 'none';
      }
    }

    async function selectClass(gradeId, classId) {
      currentGradeId = gradeId;
      currentClassId = classId;
      
      const grade = gradesData.find(g => g.id === gradeId);
      const cls = grade?.classes.find(c => c.id === classId);
      
      document.getElementById('pageTitle').textContent = cls?.class_name || '作业列表';
      document.getElementById('pageSubtitle').textContent = `${grade?.fullName || ''} · 每日作业`;
      
      renderGradeList();
      await loadHomeworkAndNotices();
      connectWS(gradeId, classId);
      document.getElementById('liveIndicator').style.display = 'inline-flex';
      document.getElementById('filterBar').style.display = 'flex';
      
      const newUrl = new URL(window.location);
      newUrl.searchParams.set('gradeId', gradeId);
      newUrl.searchParams.set('classId', classId);
      window.history.replaceState({}, '', newUrl);
    }

    async function loadHomeworkAndNotices() {
      if (!currentGradeId || !currentClassId) return;
      
      document.getElementById('homeworkList').innerHTML = '<div class="loading"><div class="spinner"></div>加载作业中...</div>';
      
      try {
        const token = API.token ? `?token=${API.token}` : '';
        const [homeworkRes, noticesRes] = await Promise.all([
          fetch(`/api/homework/public/${currentGradeId}/${currentClassId}${token}`).then(r => r.json()),
          fetch(`/api/notices/public/${currentGradeId}/${currentClassId}${token}`).then(r => r.json())
        ]);
        
        allHomework = homeworkRes.data?.list || [];
        allNotices = noticesRes.data || [];
        
        renderNotices();
        renderSubjectFilters();
        renderHomework();
      } catch (e) {
        showToast('加载失败', 'error');
        document.getElementById('homeworkList').innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-text">加载失败，请刷新重试</div></div>';
      }
    }

    function renderSubjectFilters() {
      const subjects = [...new Set(allHomework.map(h => h.subject_name).filter(Boolean))];
      const bar = document.getElementById('filterBar');
      bar.innerHTML = `
        <button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">全部科目</button>
        ${subjects.map(s => `
          <button class="filter-btn ${currentFilter === s ? 'active' : ''}" onclick="setFilter('${s}')">${s}</button>
        `).join('')}
      `;
    }

    function setFilter(filter) {
      currentFilter = filter;
      renderSubjectFilters();
      renderHomework();
    }

    function renderHomework() {
      const container = document.getElementById('homeworkList');
      let filtered = allHomework;
      
      if (currentFilter !== 'all') {
        filtered = allHomework.filter(h => h.subject_name === currentFilter);
      }
      
      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无作业</div></div>';
        return;
      }

      container.innerHTML = filtered.map(h => {
        const subjectColor = h.subject_color || getSubjectColor(h.subject_name);
        const links = h.links || [];
        const attachments = h.attachments || [];
        
        return `
          <div class="homework-card" data-id="${h.id}">
            <div class="homework-header">
              <div>
                <div class="homework-subject">
                  <span class="subject-dot" style="background:${subjectColor}"></span>
                  <span class="badge badge-primary" style="background:${subjectColor}20;color:${subjectColor}">${h.subject_name || '其他'}</span>
                </div>
                <div class="homework-title mt-8">${h.title}</div>
              </div>
            </div>
            <div class="homework-meta">
              <span class="homework-meta-item">👨‍🏫 ${h.teacher_name || '未知教师'}</span>
              <span class="homework-meta-item">🕐 ${formatDateTime(h.created_at)}</span>
              ${h.deadline ? `<span class="homework-meta-item">📅 截止: ${formatDate(h.deadline)}</span>` : ''}
              <span class="homework-meta-item">👁 ${h.view_count || 0}次查看</span>
            </div>
            <div class="homework-content" id="content-${h.id}">${h.content}</div>
            <button class="expand-btn" onclick="toggleExpand('${h.id}')" id="expand-${h.id}" style="display:none">展开全文 ▼</button>
            ${links.length > 0 ? `
              <div class="homework-links">
                ${links.map(l => `<a href="${l.url}" target="_blank" class="link-item">🔗 ${l.name || l.url}</a>`).join('')}
              </div>
            ` : ''}
            ${attachments.length > 0 ? `
              <div class="attachments-list">
                ${attachments.map(a => `<a href="${a.url}" target="_blank" class="attachment-item">📎 ${a.name}</a>`).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      setTimeout(() => {
        document.querySelectorAll('.homework-content').forEach(el => {
          if (el.scrollHeight > 80) {
            el.classList.add('collapsed');
            const btnId = 'expand-' + el.id.replace('content-', '');
            const btn = document.getElementById(btnId);
            if (btn) btn.style.display = 'block';
          }
        });
      }, 100);
    }

    function toggleExpand(id) {
      const content = document.getElementById(`content-${id}`);
      const btn = document.getElementById(`expand-${id}`);
      if (content.classList.contains('collapsed')) {
        content.classList.remove('collapsed');
        btn.textContent = '收起 ▲';
      } else {
        content.classList.add('collapsed');
        btn.textContent = '展开全文 ▼';
      }
    }

    function renderNotices() {
      const container = document.getElementById('noticeContainer');
      const urgentNotices = allNotices.filter(n => n.type === 'urgent');
      
      if (urgentNotices.length === 0) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = urgentNotices.map(n => `
        <div class="notice-banner">
          <div class="notice-icon">${n.type === 'urgent' ? '🚨' : '📢'}</div>
          <div class="notice-content">
            <div class="notice-title">${n.title}</div>
            <div class="notice-text">${n.content}</div>
          </div>
          <button class="notice-close" onclick="this.closest('.notice-banner').remove()">×</button>
        </div>
      `).join('');
    }

    function connectWS(gradeId, classId) {
      if (ws) ws.close();
      ws = connectWebSocket(gradeId, classId, (data) => {
        if (data.type === 'homework_created' || data.type === 'homework_updated') {
          showToast('作业已更新', 'info');
          loadHomeworkAndNotices();
        } else if (data.type === 'notice_created') {
          showToast('有新公告', 'info');
          loadHomeworkAndNotices();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
